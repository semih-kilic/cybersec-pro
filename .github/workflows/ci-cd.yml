name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  # ── Rust Backend ──────────────────────────────────────────
  backend-check:
    name: Backend Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        run: |
          mkdir -p ci-reports
          cargo check --release 2>&1 | tee ci-reports/cargo-check.log

      - name: Run clippy lints
        run: |
          set +e
          cargo clippy --release -- -W warnings 2>&1 | tee ci-reports/cargo-clippy.log
          echo "exit_code=$?" > ci-reports/cargo-clippy-exit.txt
          exit 0

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: rust-backend/ci-reports

  # ── Frontend ──────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: i18n coverage check
        run: npm run i18n:check

      - name: i18n residual check
        run: npm run i18n:residual

      - name: Type check
        run: npm run type-check

      - name: Purple Team flow tests
        run: npm run test:purple-flow

      - name: Runtime guard tests
        run: npm run test:runtime-guards

      - name: Runtime guard tests (scans)
        run: npm run test:runtime-guards-scans

      - name: Build
        run: npm run build

      - name: Upload i18n reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-reports
          path: |
            saas-frontend/i18n-coverage-report.json
            saas-frontend/i18n-residual-report.json

  # ── Deploy (only on master push) ──────────────────────────
  deploy:
    name: Deploy to Production
    needs: [backend-check, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/cybersec-pro

            # Pull latest
            git pull origin master

            # Build backend
            cd rust-backend
            cargo build --release

            # Build frontend
            cd ../saas-frontend
            npm ci
            npm run build

            # Deploy frontend
            sudo cp -r dist/* /var/www/dashboard/

            # Restart backend
            cd ../rust-backend
            pkill -f cybersec-pro-backend || true
            sleep 2
            nohup ./target/release/cybersec-pro-backend > /tmp/cybersec-backend.log 2>&1 &

            echo "✅ Deployment complete"
