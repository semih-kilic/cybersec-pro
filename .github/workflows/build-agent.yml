name: Build agent binaries

on:
  push:
    branches: [master]
    paths:
      - 'rust-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: cybersec-agent-darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: cybersec-agent-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: cybersec-agent-linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: cybersec-agent-linux-arm64
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross compiler (aarch64-linux-gnu)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p rust-agent/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > rust-agent/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-agent/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust-agent/Cargo.lock', 'rust-agent/Cargo.toml') }}

      - name: Build
        working-directory: rust-agent
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip
        if: runner.os != 'Linux' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: rust-agent
        run: strip target/${{ matrix.target }}/release/cybersec-agent

      - name: Strip (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: rust-agent
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/cybersec-agent

      - name: Rename
        working-directory: rust-agent
        run: cp target/${{ matrix.target }}/release/cybersec-agent ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust-agent/${{ matrix.artifact }}
          if-no-files-found: error

  universal:
    name: Build darwin-universal
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cybersec-agent-darwin-amd64
          path: ./amd64
      - uses: actions/download-artifact@v4
        with:
          name: cybersec-agent-darwin-arm64
          path: ./arm64
      - name: lipo
        run: |
          lipo -create \
            ./amd64/cybersec-agent-darwin-amd64 \
            ./arm64/cybersec-agent-darwin-arm64 \
            -output ./cybersec-agent-darwin-universal
          file ./cybersec-agent-darwin-universal
      - uses: actions/upload-artifact@v4
        with:
          name: cybersec-agent-darwin-universal
          path: ./cybersec-agent-darwin-universal
          if-no-files-found: error

  docker:
    name: Build & push Docker image
    needs: build
    runs-on: ubuntu-latest
    # Only push to Docker Hub when secrets are present (skipped on PRs / forks).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME && format('{0}/cybersec-agent', secrets.DOCKERHUB_USERNAME) || 'cybersec-agent' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v1,enable={{is_default_branch}}

      - name: Build (and push if creds available)
        uses: docker/build-push-action@v6
        with:
          context: rust-agent
          file: rust-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
