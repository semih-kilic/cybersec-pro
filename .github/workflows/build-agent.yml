name: Build agent binaries

on:
  push:
    branches: [master]
    paths:
      - 'rust-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-14
            artifact: cybersec-agent-darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: cybersec-agent-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: cybersec-agent-linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: cybersec-agent-linux-arm64
            cross: true
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            artifact: cybersec-agent-windows-amd64.exe
            windows: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross compiler (aarch64-linux-gnu)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p rust-agent/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > rust-agent/.cargo/config.toml

      - name: Install cross compiler (x86_64-w64-mingw32)
        if: matrix.windows
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          mkdir -p rust-agent/.cargo
          printf '[target.x86_64-pc-windows-gnu]\nlinker = "x86_64-w64-mingw32-gcc"\n' > rust-agent/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-agent/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust-agent/Cargo.lock', 'rust-agent/Cargo.toml') }}

      - name: Build
        working-directory: rust-agent
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip
        if: (runner.os != 'Linux' || matrix.target == 'x86_64-unknown-linux-gnu') && !matrix.windows
        working-directory: rust-agent
        run: strip target/${{ matrix.target }}/release/cybersec-agent

      - name: Strip (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: rust-agent
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/cybersec-agent

      - name: Strip (windows)
        if: matrix.windows
        working-directory: rust-agent
        run: x86_64-w64-mingw32-strip target/${{ matrix.target }}/release/cybersec-agent.exe

      - name: Rename
        working-directory: rust-agent
        run: |
          if [ -n "${{ matrix.windows }}" ]; then
            cp target/${{ matrix.target }}/release/cybersec-agent.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/cybersec-agent ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust-agent/${{ matrix.artifact }}
          if-no-files-found: error

  universal:
    name: Build darwin-universal
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cybersec-agent-darwin-amd64
          path: ./amd64
      - uses: actions/download-artifact@v4
        with:
          name: cybersec-agent-darwin-arm64
          path: ./arm64
      - name: lipo
        run: |
          lipo -create \
            ./amd64/cybersec-agent-darwin-amd64 \
            ./arm64/cybersec-agent-darwin-arm64 \
            -output ./cybersec-agent-darwin-universal
          file ./cybersec-agent-darwin-universal
      - uses: actions/upload-artifact@v4
        with:
          name: cybersec-agent-darwin-universal
          path: ./cybersec-agent-darwin-universal
          if-no-files-found: error

  docker:
    name: Build & push Docker image
    needs: build
    runs-on: ubuntu-latest
    # Only push to Docker Hub when secrets are present (skipped on PRs / forks).
    if: github.event_name != 'pull_request'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine if Docker Hub push is enabled
        id: dh
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=${DOCKERHUB_USERNAME}/cybersec-agent" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=cybersec-agent" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dh.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dh.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v1,enable={{is_default_branch}}

      - name: Build (and push if creds available)
        uses: docker/build-push-action@v6
        with:
          context: rust-agent
          file: rust-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.dh.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
