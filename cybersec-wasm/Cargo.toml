[package]
name = "cybersec-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly modules for CyberSec Pro frontend"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
