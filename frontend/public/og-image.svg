    <text x="80" y="38" font-family="monospace" font-size="28" font-weight="700" fill="#00d4ff" text-anchor="middle">61</text>
    <text x="80" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Categories</text>
  </g>
  <g transform="translate(422, 370)">
    <rect width="160" height="80" rx="10" fill="rgba(180,74,255,0.06)" stroke="rgba(180,74,255,0.15)" stroke-width="1"/>
    <text x="80" y="38" font-family="monospace" font-size="28" font-weight="700" fill="#b44aff" text-anchor="middle">99.9%</text>
    <text x="80" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Uptime SLA</text>
  </g>

  <!-- Right side: Terminal/code snippet -->
  <g transform="translate(680, 110)">
    <rect width="460" height="380" rx="12" fill="rgba(13,17,23,0.9)" stroke="rgba(159,239,0,0.2)" stroke-width="1"/>
    <rect width="460" height="36" rx="12" fill="rgba(159,239,0,0.05)"/>
    <rect width="460" height="12" y="24" fill="rgba(159,239,0,0.05)"/>
    <circle cx="20" cy="18" r="5" fill="#ff3e3e" opacity="0.7"/>
    <circle cx="38" cy="18" r="5" fill="#ff9f1c" opacity="0.7"/>
    <circle cx="56" cy="18" r="5" fill="#9fef00" opacity="0.7"/>
    <text x="230" y="23" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">scan-results.sh</text>

    <text x="20" y="65" font-family="monospace" font-size="13" fill="#9fef00">$ nmap -sV -sC target.com</text>
    <text x="20" y="90" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.5)">Starting Nmap 7.94 scan...</text>
    <text x="20" y="115" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.5)">PORT    STATE  SERVICE  VERSION</text>
    <text x="20" y="140" font-family="monospace" font-size="13" fill="#00d4ff">22/tcp  open   ssh      OpenSSH 8.9</text>
    <text x="20" y="165" font-family="monospace" font-size="13" fill="#00d4ff">80/tcp  open   http     nginx 1.24</text>
    <text x="20" y="190" font-family="monospace" font-size="13" fill="#ff3e3e">443/tcp open   https    ⚠ TLS 1.0</text>
    <text x="20" y="215" font-family="monospace" font-size="13" fill="#ff9f1c">3306/tcp open  mysql    MySQL 5.7</text>
    <text x="20" y="250" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.3)">─────────────────────────────</text>
    <text x="20" y="275" font-family="monospace" font-size="13" fill="#9fef00">$ nikto -h target.com</text>
    <text x="20" y="300" font-family="monospace" font-size="13" fill="#ff3e3e">+ OSVDB-3092: /admin/: Found</text>
    <text x="20" y="325" font-family="monospace" font-size="13" fill="#ff9f1c">+ X-Frame-Options: missing</text>
    <text x="20" y="350" font-family="monospace" font-size="13" fill="#9fef00">Scan complete: 4 vulns found</text>
  </g>

  <!-- Bottom bar -->
  <text x="62" y="540" font-family="monospace" font-size="14" fill="rgba(159,239,0,0.5)">semihkilic.com</text>
  <text x="62" y="565" font-family="Inter, system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Start Free · No Credit Card Required</text>

  <!-- Decorative corner brackets -->
  <path d="M20 20 L20 50 M20 20 L50 20" stroke="#9fef00" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M1180 20 L1180 50 M1180 20 L1150 20" stroke="#9fef00" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M20 610 L20 580 M20 610 L50 610" stroke="#9fef00" stroke-width="2" opacity="0.4" fill="none"/>
