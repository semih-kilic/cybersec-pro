<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="50%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#9fef00" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#9fef00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#9fef00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="60%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#b44aff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b44aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fef00"/>
      <stop offset="100%" stop-color="#5cb800"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070a0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="statGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9fef00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9fef00" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="statCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="statPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b44aff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b44aff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#9fef00" stroke-width="0.4" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>

  <g opacity="0.18" stroke="#9fef00" stroke-width="0.5">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <rect x="8" y="8" width="1184" height="614" rx="20" fill="none" stroke="#9fef00" stroke-width="1.5" opacity="0.35"/>
  <rect x="14" y="14" width="1172" height="602" rx="16" fill="none" stroke="#9fef00" stroke-width="0.5" opacity="0.15"/>

  <g stroke="#9fef00" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M40 40 L40 80 M40 40 L80 40"/>
    <path d="M1160 40 L1160 80 M1160 40 L1120 40"/>
    <path d="M40 590 L40 550 M40 590 L80 590"/>
    <path d="M1160 590 L1160 550 M1160 590 L1120 590"/>
  </g>

  <!-- Logo: shield with checkmark -->
  <g transform="translate(72, 80)" filter="url(#softGlow)">
    <path d="M0 0 L72 0 L72 50 Q72 78 36 88 Q0 78 0 50 Z" fill="url(#logoGrad)" opacity="0.15"/>
    <path d="M0 0 L72 0 L72 50 Q72 78 36 88 Q0 78 0 50 Z" fill="none" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <path d="M18 42 L32 56 L56 28" fill="none" stroke="#9fef00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="170" y="120" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1.5">CyberSec Pro</text>
  <text x="170" y="148" font-size="14" font-weight="600" fill="#9fef00" letter-spacing="3">CLOUD&#160;OFFENSIVE&#160;SECURITY</text>

  <text x="72" y="240" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2">Hack Smarter.</text>
  <text x="72" y="304" font-size="56" font-weight="800" fill="#9fef00" letter-spacing="-2">Ship Safer.</text>

  <text x="72" y="356" font-size="20" font-weight="500" fill="#a8b3c0">329 Kali Linux tools, browser-based.</text>
  <text x="72" y="384" font-size="20" font-weight="500" fill="#a8b3c0">Automated scans, AI triage, compliance reports.</text>

  <g transform="translate(72, 420)">
    <g>
      <rect width="150" height="80" rx="12" fill="url(#statGreen)" stroke="#9fef00" stroke-width="1" opacity="0.9"/>
      <text x="75" y="44" font-size="32" font-weight="800" fill="#9fef00" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">329</text>
      <text x="75" y="65" font-size="11" font-weight="600" fill="#7a8794" text-anchor="middle" letter-spacing="1.5">SECURITY&#160;TOOLS</text>
    </g>
    <g transform="translate(170, 0)">
      <rect width="150" height="80" rx="12" fill="url(#statCyan)" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
      <text x="75" y="44" font-size="32" font-weight="800" fill="#00d4ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">61</text>
      <text x="75" y="65" font-size="11" font-weight="600" fill="#7a8794" text-anchor="middle" letter-spacing="1.5">CATEGORIES</text>
    </g>
    <g transform="translate(340, 0)">
      <rect width="150" height="80" rx="12" fill="url(#statPurple)" stroke="#b44aff" stroke-width="1" opacity="0.9"/>
      <text x="75" y="44" font-size="32" font-weight="800" fill="#b44aff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">99.9%</text>
      <text x="75" y="65" font-size="11" font-weight="600" fill="#7a8794" text-anchor="middle" letter-spacing="1.5">UPTIME&#160;SLA</text>
    </g>
  </g>

  <!-- Right: Terminal preview -->
  <g transform="translate(680, 90)">
    <rect x="6" y="8" width="460" height="450" rx="14" fill="#000" opacity="0.4"/>
    <rect width="460" height="450" rx="14" fill="url(#codeGrad)" stroke="#9fef00" stroke-width="1" opacity="0.95"/>
    <rect width="460" height="40" rx="14" fill="#161b22"/>
    <rect y="20" width="460" height="20" fill="#161b22"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="20" r="6" fill="#febc2e"/>
    <circle cx="62" cy="20" r="6" fill="#28c840"/>
    <text x="230" y="25" font-size="12" fill="#7a8794" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">scan.sh — cyber-sec-pro</text>

    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">
      <text x="20" y="78" fill="#7a8794">$ </text>
      <text x="38" y="78" fill="#9fef00">cybersec</text>
      <text x="115" y="78" fill="#ffffff"> scan</text>
      <text x="160" y="78" fill="#00d4ff"> --target</text>
      <text x="240" y="78" fill="#ffd966"> example.com</text>

      <text x="20" y="108" fill="#7a8794">[+] Loading 329 tools...</text>
      <text x="20" y="132" fill="#7a8794">[+] Spawning ephemeral runner</text>
      <text x="20" y="156" fill="#7a8794">[+] Phase 1: Reconnaissance</text>

      <text x="20" y="190" fill="#9fef00">  ✓</text>
      <text x="42" y="190" fill="#cdd9e5">nmap, masscan, naabu</text>
      <text x="20" y="214" fill="#9fef00">  ✓</text>
      <text x="42" y="214" fill="#cdd9e5">subfinder, amass, httpx</text>
      <text x="20" y="238" fill="#9fef00">  ✓</text>
      <text x="42" y="238" fill="#cdd9e5">nuclei, nikto, gobuster</text>

      <text x="20" y="272" fill="#7a8794">[+] Phase 2: Vulnerability Scan</text>

      <text x="20" y="302" fill="#ff5f57">  ⚠ </text>
      <text x="50" y="302" fill="#ffffff">CVE-2024-3094 (CRITICAL)</text>
      <text x="20" y="326" fill="#febc2e">  ⚠ </text>
      <text x="50" y="326" fill="#ffffff">Outdated TLS 1.0 detected</text>
      <text x="20" y="350" fill="#febc2e">  ⚠ </text>
      <text x="50" y="350" fill="#ffffff">Missing CSP headers</text>

      <text x="20" y="384" fill="#9fef00">[✓] AI Triage:</text>
      <text x="135" y="384" fill="#cdd9e5"> 3 actionable findings</text>
      <text x="20" y="408" fill="#9fef00">[✓] Report exported </text>
      <text x="170" y="408" fill="#7a8794">→ PDF · 12 pages</text>

      <text x="20" y="436" fill="#7a8794">$ </text>
      <text x="38" y="436" fill="#9fef00">_</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <g transform="translate(72, 568)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#9fef00" font-family="ui-monospace, 'SF Mono', Menlo, monospace">cyber-sec-pro.com</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#5e6a78">Start Free · No Credit Card · 3-Day Trial</text>
  </g>

  <g transform="translate(960, 555)">
    <rect width="170" height="34" rx="17" fill="rgba(159,239,0,0.10)" stroke="#9fef00" stroke-width="1"/>
    <text x="85" y="22" font-size="12" font-weight="700" fill="#9fef00" text-anchor="middle" letter-spacing="1.5">SOC 2 · GDPR · ISO 27001</text>
  </g>
</svg>
