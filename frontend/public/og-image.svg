  <rect x="60" y="50" width="400" height="36" rx="8" fill="rgba(159,239,0,0.06)" stroke="rgba(159,239,0,0.15)" stroke-width="1"/>
  <circle cx="80" cy="68" r="5" fill="#ff3e3e" opacity="0.8"/>
  <circle cx="98" cy="68" r="5" fill="#ff9f1c" opacity="0.8"/>
  <circle cx="116" cy="68" r="5" fill="#9fef00" opacity="0.8"/>
  <text x="140" y="73" font-family="monospace" font-size="13" fill="rgba(159,239,0,0.6)">~/cybersec-pro $</text>

  <!-- Logo icon (simplified shield) -->
  <g transform="translate(60, 130)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="#9fef00" stroke-width="2.5" opacity="0.9"/>
    <text x="40" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#9fef00" text-anchor="middle">CS</text>
  </g>

  <!-- Brand name -->
  <text x="160" y="165" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">CyberSec Pro</text>

  <!-- Tagline -->
  <text x="62" y="240" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#9fef00" letter-spacing="0.5">Cloud Offensive Security Platform</text>

  <!-- Description -->
  <text x="62" y="290" font-family="Inter, system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">401 Kali Linux Tools · 61 Categories · Browser-Based</text>
  <text x="62" y="320" font-family="Inter, system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">Automated Vulnerability Scanning &amp; Penetration Testing</text>

  <!-- Stats boxes -->
  <g transform="translate(62, 370)">
    <rect width="160" height="80" rx="10" fill="rgba(159,239,0,0.06)" stroke="rgba(159,239,0,0.15)" stroke-width="1"/>
    <text x="80" y="38" font-family="monospace" font-size="28" font-weight="700" fill="#9fef00" text-anchor="middle">401</text>
    <text x="80" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Security Tools</text>
