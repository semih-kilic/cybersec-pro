# CyberSec Pro - Nginx Configuration (Fixed for SPA)
# Fixes React Router support for /dashboard/* routes

server {
    listen 80;
    server_name semihkilic.com www.semihkilic.com cybersecpro.com www.cybersecpro.com app.cybersecpro.com cybersecpro.semihkilic.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main site root
    root /home/cybersec/cybersec-pro/cybersec-sales/frontend;
    index index.html;

    # Dashboard SPA - FIXED for React Router with trailing slash
    location /dashboard/ {
        alias /home/cybersec/cybersec-pro/saas-frontend/dist/;
        try_files $uri $uri/ /dashboard/index.html;
    }
    
    # Redirect /dashboard to /dashboard/
    location = /dashboard {
        return 301 /dashboard/;
    }

    # App Dashboard (Alternative path)
    location /app/ {
        alias /home/cybersec/cybersec-pro/saas-frontend/dist/;
        try_files $uri $uri/ /app/index.html;
    }
    
    location = /app {
        return 301 /app/;
    }

    # Login page
    location = /login {
        try_files /login.html =404;
    }

    # GitHub OAuth callback
    location /auth/github/callback {
        try_files /auth/github/callback.html =404;
    }

    # Static HTML files
    location ~ ^/([a-zA-Z0-9_-]+)\.html$ {
        try_files $uri =404;
    }

    # Main site - serve static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # API Backend (Port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # SaaS API Backend v1
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # SaaS API Backend v2
    location /api/v2/ {
        proxy_pass http://127.0.0.1:5001/api/v2/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
