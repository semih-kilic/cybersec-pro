[package]
name = "cybersec-tools"
version = "0.1.0"
edition = "2021"
description = "Operational tools for CyberSec Pro — migrated from Python/Bash to Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
which = "7"
glob = "0.3"
indicatif = "0.17"
colored = "2"

[[bin]]
name = "csec-health-probe"
path = "src/bin/health_probe.rs"

[[bin]]
name = "csec-smoke-test"
path = "src/bin/smoke_test.rs"

[[bin]]
name = "csec-audit-gate"
path = "src/bin/audit_gate.rs"

[[bin]]
name = "csec-disk-cleanup"
path = "src/bin/disk_cleanup.rs"

[[bin]]
name = "csec-backup-db"
path = "src/bin/backup_db.rs"

[[bin]]
name = "csec-watchdog"
path = "src/bin/watchdog.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
