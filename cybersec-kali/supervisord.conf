[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:tool-api]
command=python3 /opt/cybersec/tool_api.py
directory=/opt/cybersec
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/tool-api.err.log
stdout_logfile=/var/log/supervisor/tool-api.out.log
environment=FLASK_ENV=production

[program:ttyd]
command=ttyd -p 7681 -W -c cybersec:CyberSecPro2026 bash
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/ttyd.err.log
stdout_logfile=/var/log/supervisor/ttyd.out.log
