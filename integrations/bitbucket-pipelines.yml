image: curlimages/curl:latest

pipelines:
  branches:
    main:
      - step:
          name: CyberSec Pro Security Scan
          script:
            - apk add --no-cache jq curl
            - |
              echo "Starting CyberSec Pro scan..."
              RESPONSE=$(curl -s -X POST "$CYBERSEC_API_URL/api/v1/scans" \
                -H "Authorization: Bearer $CYBERSEC_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                  \"target\": \"${BITBUCKET_GIT_HTTP_ORIGIN}\",
                  \"scan_type\": \"full\",
                  \"ref\": \"${BITBUCKET_COMMIT}\"
                }")
              SCAN_ID=$(echo $RESPONSE | jq -r '.scan_id')
              echo "Scan ID: $SCAN_ID"
              
              for i in $(seq 1 60); do
                STATUS=$(curl -s "$CYBERSEC_API_URL/api/v1/scans/$SCAN_ID" \
                  -H "Authorization: Bearer $CYBERSEC_API_KEY" | jq -r '.status')
                if [ "$STATUS" = "completed" ]; then
                  echo "Scan completed"
                  break
                elif [ "$STATUS" = "failed" ]; then
                  echo "Scan failed"
                  exit 1
                fi
                echo "Status: $STATUS (attempt $i/60)"
                sleep 30
              done
              
              RESULTS=$(curl -s "$CYBERSEC_API_URL/api/v1/scans/$SCAN_ID/results" \
                -H "Authorization: Bearer $CYBERSEC_API_KEY")
              
              CRITICAL=$(echo "$RESULTS" | jq '[.findings[] | select(.severity == "critical")] | length')
              HIGH=$(echo "$RESULTS" | jq '[.findings[] | select(.severity == "high")] | length')
              
              echo "Critical: $CRITICAL, High: $HIGH"
              
              if [ "$CRITICAL" -gt 0 ]; then
                echo "Critical vulnerabilities found!"
                exit 1
              fi

  pull-requests:
    '**':
      - step:
          name: CyberSec Pro Security Scan
          script:
            - apk add --no-cache jq curl
            - |
              echo "Starting CyberSec Pro scan for PR..."
              RESPONSE=$(curl -s -X POST "$CYBERSEC_API_URL/api/v1/scans" \
                -H "Authorization: Bearer $CYBERSEC_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                  \"target\": \"${BITBUCKET_GIT_HTTP_ORIGIN}\",
                  \"scan_type\": \"full\",
                  \"ref\": \"${BITBUCKET_COMMIT}\"
                }")
              SCAN_ID=$(echo $RESPONSE | jq -r '.scan_id')
              echo "Scan ID: $SCAN_ID"
              
              for i in $(seq 1 60); do
                STATUS=$(curl -s "$CYBERSEC_API_URL/api/v1/scans/$SCAN_ID" \
                  -H "Authorization: Bearer $CYBERSEC_API_KEY" | jq -r '.status')
                if [ "$STATUS" = "completed" ]; then
                  echo "Scan completed"
                  break
                elif [ "$STATUS" = "failed" ]; then
                  echo "Scan failed"
                  exit 1
                fi
                echo "Status: $STATUS (attempt $i/60)"
                sleep 30
              done
              
              RESULTS=$(curl -s "$CYBERSEC_API_URL/api/v1/scans/$SCAN_ID/results" \
                -H "Authorization: Bearer $CYBERSEC_API_KEY")
              
              CRITICAL=$(echo "$RESULTS" | jq '[.findings[] | select(.severity == "critical")] | length')
              HIGH=$(echo "$RESULTS" | jq '[.findings[] | select(.severity == "high")] | length')
              
              echo "Critical: $CRITICAL, High: $HIGH"
              
              if [ "$CRITICAL" -gt 0 ]; then
                echo "Critical vulnerabilities found!"
                exit 1
              fi
