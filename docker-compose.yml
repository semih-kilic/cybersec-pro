# 🐉 CyberSec Pro - Production Docker Compose
# All services in one place with auto-restart

version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: cybersec-db
    restart: always
    environment:
      POSTGRES_DB: cybersec_pro
      POSTGRES_USER: cybersec
      POSTGRES_PASSWORD: ${DB_PASSWORD:-***REDACTED_PG_PASSWORD***}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersec -d cybersec_pro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybersec-network

  # ============================================
  # Redis Cache & Sessions
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: cybersec-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybersec-network

  # ============================================
  # Rust API Backend (Axum)
  # ============================================
  rust-backend:
    build:
      context: ./rust-backend
      dockerfile: Dockerfile
    container_name: cybersec-api
    restart: always
    environment:
      - DATABASE_URL=postgres://cybersec:${DB_PASSWORD:-***REDACTED_PG_PASSWORD***}@postgres:5432/cybersec_pro
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-cybersec-2026-production}
      - RUST_LOG=info
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rust-scan-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cybersec-network

  # ============================================
  # Rust Scan Engine (Dedicated scanner runtime)
  # ============================================
  rust-scan-engine:
    build:
      context: ./rust-scan-engine
      dockerfile: Dockerfile
    container_name: cybersec-scan-engine
    restart: always
    environment:
      - DATABASE_URL=postgres://cybersec:${DB_PASSWORD:-***REDACTED_PG_PASSWORD***}@postgres:5432/cybersec_pro
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-cybersec-2026-production}
      - SCAN_ENGINE_PORT=5002
      - RUST_LOG=info
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cybersec-network

  # ============================================
  # React Frontend (SPA)
  # ============================================
  saas-frontend:
    build:
      context: ./saas-frontend
      dockerfile: Dockerfile
    container_name: cybersec-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - rust-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cybersec-network

  # ============================================
  # Nginx Reverse Proxy (Production)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: cybersec-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - rust-backend
      - saas-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cybersec-network

  # ============================================
  # Kali Linux Tools Container
  # ============================================
  kali-tools:
    build:
      context: ./cybersec-kali
      dockerfile: Dockerfile.kali
    container_name: cybersec-kali
    restart: always
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - TERM=xterm-256color
      - API_SECRET=${API_SECRET:-kali-api-secret-2026}
    volumes:
      - ./cybersec-kali/tools:/opt/tools
      - ./cybersec-kali/data:/root/data
      - kali_home:/root
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5003:5003"   # Tool Execution API
      - "2222:22"     # SSH Access (Pro users)
      - "7681:7681"   # Web Terminal (ttyd)
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cybersec-network

  # ============================================
  # Web Terminal Service (ttyd)
  # ============================================
  web-terminal:
    image: tsl0922/ttyd:alpine
    container_name: cybersec-terminal
    restart: always
    command: ttyd -p 7681 -W bash
    volumes:
      - kali_home:/root
    ports:
      - "7682:7681"
    networks:
      - cybersec-network

  # ============================================
  # WireGuard VPN (Enterprise)
  # ============================================
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: cybersec-vpn
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul
      - SERVERURL=${VPN_SERVER_URL:-vpn.cybersecpro.com}
      - SERVERPORT=51820
      - PEERS=10
      - PEERDNS=auto
    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - cybersec-network

# ============================================
# Networks
# ============================================
networks:
  cybersec-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kali_home:
    driver: local
  nginx_logs:
    driver: local
  wireguard_config:
    driver: local
