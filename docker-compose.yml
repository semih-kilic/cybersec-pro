services:
  postgres:
    image: postgres:18-alpine
    container_name: cybersec-db
    restart: always
    environment:
      POSTGRES_DB: cybersec_pro
      POSTGRES_USER: cybersec
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U cybersec -d cybersec_pro
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
    - cybersec-network
  redis:
    image: redis:7-alpine
    container_name: cybersec-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD
      must be set}
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - -a
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
    - cybersec-network
  rust-backend:
    build:
      context: ./rust-backend
      dockerfile: Dockerfile
    container_name: cybersec-api
    restart: always
    env_file:
    - ./rust-backend/.env
    environment:
    - DATABASE_URL=postgres://cybersec:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/cybersec_pro
    - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
    - SCAN_ENGINE_URL=http://rust-scan-engine:5002
    - RUST_LOG=info
    - HOST=0.0.0.0
    - PORT=5001
    - AGENT_BIN_DIR=/agent-binaries
    volumes:
    - ./agent-binaries:/agent-binaries:ro
    ports:
    - 127.0.0.1:5001:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
    - cybersec-network
  rust-scan-engine:
    build:
      context: .
      dockerfile: rust-scan-engine/Dockerfile
    container_name: cybersec-scan-engine
    cap_add:
    - NET_RAW
    - NET_ADMIN
    restart: always
    env_file:
    - ./rust-backend/.env
    environment:
    - DATABASE_URL=postgres://cybersec:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/cybersec_pro
    - SCAN_ENGINE_PORT=5002
    - RUST_LOG=info
    ports:
    - 127.0.0.1:5002:5002
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:5002/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
    - cybersec-network
  nginx:
    image: nginx:alpine
    container_name: cybersec-nginx
    restart: always
    ports:
    - 80:80
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    - ./frontend:/srv/frontend:ro
    - ./saas-frontend:/srv/saas-frontend:ro
    - ./status:/srv/status:ro
    - nginx_logs:/var/log/nginx
    depends_on:
    - rust-backend
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost/
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - cybersec-network
  kali-tools:
    build:
      context: ./cybersec-kali
      dockerfile: Dockerfile.kali
    container_name: cybersec-kali
    restart: always
    profiles:
    - advanced
    cap_add:
    - NET_ADMIN
    - NET_RAW
    environment:
    - DEBIAN_FRONTEND=noninteractive
    - TERM=xterm-256color
    - API_SECRET=${API_SECRET:?API_SECRET must be set}
    volumes:
    - ./cybersec-kali/tools:/opt/tools
    - ./cybersec-kali/data:/root/data
    - kali_home:/root
    ports:
    - 127.0.0.1:5003:5003
    - 127.0.0.1:2222:22
    - 127.0.0.1:7681:7681
    depends_on:
    - redis
    networks:
    - cybersec-network
  web-terminal:
    image: tsl0922/ttyd:alpine
    container_name: cybersec-terminal
    restart: always
    profiles:
    - advanced
    command: ttyd -p 7681 -W bash
    volumes:
    - kali_home:/root
    ports:
    - "127.0.0.1:7682:7681"
    networks:
    - cybersec-network
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: cybersec-vpn
    restart: always
    profiles:
    - advanced
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Istanbul
    - SERVERURL=${VPN_SERVER_URL:-vpn.cyber-sec-pro.com}
    - SERVERPORT=51820
    - PEERS=10
    - PEERDNS=auto
    volumes:
    - wireguard_config:/config
    - /lib/modules:/lib/modules
    ports:
    - 51820:51820/udp
    sysctls:
    - net.ipv4.conf.all.src_valid_mark=1
    networks:
    - cybersec-network
networks:
  cybersec-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.29.0.0/16
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kali_home:
    driver: local
  nginx_logs:
    driver: local
  wireguard_config:
    driver: local
