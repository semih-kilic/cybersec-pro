[package]
name = "cybersec-pro-backend"
version = "4.0.0"
edition = "2021"
description = "CyberSec Pro SaaS Backend — Rust/Axum Edition"
authors = ["Semih Kılıç"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "limit", "fs"] }
hyper = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & Security
jsonwebtoken = "9"
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

# MFA / TOTP
totp-rs = { version = "5", features = ["gen_secret", "qr"] }

# OAuth2
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# UUID & DateTime
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Rate Limiting
governor = "0.6"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Process management (scan engine)
tokio-process = "0.2"
nix = { version = "0.28", features = ["process", "signal", "pty"] }
portable-pty = "0.8"

# Stripe
stripe-rust = "0.34"

# Redis (optional rate limiting)
redis = { version = "0.25", features = ["tokio-comp"] }

# Misc
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
regex = "1"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
parking_lot = "0.12"
dashmap = "5"

# SSE
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
