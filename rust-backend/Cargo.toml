[package]
name = "cybersec-pro-backend"
version = "4.0.0"
edition = "2021"
description = "CyberSec Pro SaaS Backend — Rust/Axum Edition"
authors = ["Semih Kılıç"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "compression-br", "limit", "fs"] }
hyper = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "derive"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.14"

# Auth & Security
jsonwebtoken = "9"
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
scrypt = "0.11"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

# MFA / TOTP
totp-rs = { version = "5", features = ["gen_secret", "qr"] }

# OAuth2
oauth2 = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# LDAP Authentication
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring", "sync"] }
urlencoding = "2"

# UUID & DateTime
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Rate Limiting
governor = "0.6"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Process management (scan engine)
nix = { version = "0.28", features = ["process", "signal"] }
portable-pty = "0.9"
lazy_static = "1"

# Stripe (stubs for now)
# async-stripe = "1.0.0-rc.3"

# Redis (optional rate limiting)
redis = { version = "0.27", features = ["tokio-comp"] }

# Email (SMTP)
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "hostname"] }

# Misc
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
regex = "1"
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = "0.12"
dashmap = "5"

# SSH & Network
ssh2 = "0.9"
ipnet = "2"
aes-gcm = "0.10"

# Cron scheduling
cron = "0.12"

# OpenAPI / Swagger
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# SSE
async-stream = "0.3"

# System telemetry (God Mode)
sysinfo = "0.30"

# CLI tool for operations
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "cybersec-pro-backend"
path = "src/main.rs"

[[bin]]
name = "translate"
path = "src/bin/translate.rs"

[[bin]]
name = "cybersec-ops"
path = "src/bin/ops.rs"
codegen-units = 1
strip = true
panic = "abort"
