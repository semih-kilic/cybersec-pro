[package]
name = "cybersec-agent"
version = "0.1.0"
edition = "2021"
description = "CyberSec Pro reverse-tunnel agent — phones home with TLS, no inbound port required."
license = "MIT"

[[bin]]
name = "cybersec-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
hostname = "0.4"
local-ip-address = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
