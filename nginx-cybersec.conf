# CyberSec Pro - Nginx Configuration
# semihkilic.com + cybersecpro.com - Main Site + SaaS API

server {
    listen 80;
    server_name semihkilic.com www.semihkilic.com cybersecpro.com www.cybersecpro.com app.cybersecpro.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend (Static files)
    root /home/cybersec/cybersec-pro/cybersec-sales/frontend;
    index index.html;

    # Dashboard SPA Routes - ALL /dashboard/* goes to React app
    location /dashboard {
        alias /home/cybersec/cybersec-pro/saas-frontend/dist;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # App Dashboard (Alternative path) - SaaS Frontend React SPA
    location /app {
        alias /home/cybersec/cybersec-pro/saas-frontend/dist;
        try_files $uri $uri/ /app/index.html;
    }

    # Login page
    location = /login {
        try_files /login.html =404;
    }

    # GitHub OAuth callback
    location /auth/github/callback {
        try_files /auth/github/callback.html =404;
    }

    # Static HTML files
    location ~ ^/([a-zA-Z0-9_-]+)\.html$ {
        try_files $uri =404;
    }

    # Main site - serve static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Sales API Backend (Port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # SaaS API Backend (Port 5001) - New endpoints
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Downloads
    location /downloads/ {
        alias /home/cybersec/cybersec-pro/cybersec-sales/downloads/;
        autoindex off;
    }

    # Install script
    location /install.sh {
        alias /home/cybersec/cybersec-pro/cybersec-sales/downloads/install.sh;
        default_type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Logs
    access_log /var/log/nginx/cybersec-access.log;
    error_log /var/log/nginx/cybersec-error.log;
}
