# CyberSec Pro - Nginx Configuration
# Next.js 15 static export + Dashboard SPA + Rust API
# Updated: 2026-04-27 — security hardening + performance

server {
    listen 80;
    server_name www.cyber-sec-pro.com cybersecpro.com www.cybersecpro.com app.cybersecpro.com app.cyber-sec-pro.com;

    # ── Hide nginx version ─────────────────────────────────────────────────
    server_tokens off;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                                          always;
    add_header X-Content-Type-Options     "nosniff"                                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"                     always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), bluetooth=()" always;
    add_header X-DNS-Prefetch-Control     "on"                                                  always;

    # Content-Security-Policy (strict, allows Google Fonts + Stripe + inline for Next.js/charts)
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.stripe.com https://www.google-analytics.com wss: ws:; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"
        always;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_buffers       16 8k;
    gzip_http_version  1.1;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xhtml+xml
        application/atom+xml
        application/rss+xml
        application/ld+json
        application/manifest+json
        application/wasm
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ── Static root ────────────────────────────────────────────────────────
    root /home/cybersec/cybersec-pro/frontend/out;
    index index.html;

    # ── Root → EN homepage (app.cyber-sec-pro.com → dashboard landing) ─
    location = / {
        if ($host = app.cyber-sec-pro.com) {
            rewrite ^ /dashboard/ last;
        }
        try_files /en/index.html =404;
    }

    # ── Per-host robots.txt / sitemap.xml ──────────────────────────────────
    # app.cyber-sec-pro.com gets the SaaS sitemap; other hosts fall through
    # to the marketing site root (frontend/out).
    location = /robots.txt {
        if ($host = app.cyber-sec-pro.com) {
            rewrite ^ /dashboard/robots.txt last;
        }
        try_files $uri =404;
    }

    location = /sitemap.xml {
        if ($host = app.cyber-sec-pro.com) {
            rewrite ^ /dashboard/sitemap.xml last;
        }
        try_files $uri =404;
    }

    # ── Next.js static assets (immutable cache) ────────────────────────────
    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
        try_files $uri =404;
    }

    # ── Dashboard SPA ──────────────────────────────────────────────────────
    location ^~ /dashboard/ {
        alias /home/cybersec/cybersec-pro/saas-frontend/dist/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    # ── App Dashboard (alt path) ───────────────────────────────────────────
    location ^~ /app/ {
        alias /home/cybersec/cybersec-pro/saas-frontend/dist/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /app {
        return 301 /app/;
    }

    # ── OAuth callback ─────────────────────────────────────────────────────
    location = /auth/callback {
        default_type text/html;
        alias /home/cybersec/cybersec-pro/saas-frontend/dist/index.html;
    }

    # ── Locale redirects ───────────────────────────────────────────────────
    location ~ ^/(tools|docs|api-reference|about|blog|careers|contact|privacy|terms|security|success|tests|admin)(/?)$ {
        return 302 /en/$1/;
    }

    # ── Tool detail pages (slug redirect to locale) ────────────────────────
    location ~ ^/tools/([^/]+)(/?)$ {
        return 302 /en/tools/$1/;
    }

    location = /login {
        return 302 /dashboard/login;
    }

    # ── WebSocket (scan streaming) ─────────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://127.0.0.1:5001/socket.io/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400;
        proxy_send_timeout     86400;
        proxy_buffering        off;
        proxy_cache            off;
    }

    # ── API Backend v1 (SSE scan streaming) ───────────────────────────────
    location /api/v1/ {
        proxy_pass             http://127.0.0.1:5001/api/v1/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection '';
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     600;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;
        proxy_buffering        off;
        proxy_cache            off;
        client_max_body_size   10m;

        add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ── API Backend v2 ─────────────────────────────────────────────────────
    location /api/v2/ {
        proxy_pass             http://127.0.0.1:5001/api/v2/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection 'upgrade';
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     600;
        proxy_buffering        off;
        proxy_cache            off;
        client_max_body_size   10m;
    }

    # ── API Backend generic ────────────────────────────────────────────────
    location /api/ {
        proxy_pass             http://127.0.0.1:5001;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection 'upgrade';
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     90;
        client_max_body_size   10m;

        add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ── Next.js locale pages ───────────────────────────────────────────────
    # Force HTTPS in any redirects nginx generates (avoids https→http downgrade
    # when behind Cloudflare/TLS terminator).
    absolute_redirect off;
    port_in_redirect off;

    # HOTFIX: a fullscreen <canvas data-engine="three.js"> in the hero section
    # was eating pointer events across the whole viewport (including over the
    # footer), making footer links un-clickable. Inject a global CSS rule that
    # neutralises pointer events on every three.js canvas. Removed once the
    # rebuilt frontend with the in-component fix is deployed.
    sub_filter '</head>' '<style>canvas[data-engine^="three.js"]{pointer-events:none!important}</style></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    location / {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        # NOTE: $uri/ removed — its presence makes nginx auto-redirect 301 to
        # add a trailing slash whenever the path is a directory, which broke
        # all footer links (e.g. /en/privacy → /en/privacy/). Trying
        # $uri/index.html directly serves the page without any redirect.
        try_files $uri $uri/index.html =404;
    }
}
