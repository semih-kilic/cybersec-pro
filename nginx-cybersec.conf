     1	# CyberSec Pro - Nginx Configuration
     2	# Next.js 15 static export + Dashboard SPA + Rust API
     3	# Updated: 2026-04-27 — security hardening + performance
     4	
     5	server {
     6	    listen 80;
     7	    server_name www.cyber-sec-pro.com cyber-sec-pro.com www.cyber-sec-pro.com app.cyber-sec-pro.com app.cyber-sec-pro.com;
     8	
     9	    # ── Hide nginx version ─────────────────────────────────────────────────
    10	    server_tokens off;
    11	
    12	    # ── Security headers ───────────────────────────────────────────────────
    13	    add_header X-Frame-Options            "SAMEORIGIN"                                          always;
    14	    add_header X-Content-Type-Options     "nosniff"                                             always;
    15	    add_header Referrer-Policy            "strict-origin-when-cross-origin"                     always;
    16	    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), bluetooth=()" always;


    # AI WebSocket Bridge (Ollama) - MUST be before sub_filter blocks
    location /jcode/ws {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    17	    add_header X-DNS-Prefetch-Control     "on"                                                  always;
    18	
    19	    # Content-Security-Policy (strict, allows Google Fonts + Stripe + inline for Next.js/charts)
    20	    add_header Content-Security-Policy
    21	        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.stripe.com https://www.google-analytics.com wss: ws:; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    22	        always;
    23	
    24	    # ── Gzip compression ───────────────────────────────────────────────────
    25	    gzip               on;
    26	    gzip_vary          on;
    27	    gzip_proxied       any;
    28	    gzip_comp_level    6;
    29	    gzip_buffers       16 8k;
    30	    gzip_http_version  1.1;
    31	    gzip_min_length    256;
    32	    gzip_types
    33	        text/plain
    34	        text/css
    35	        text/javascript
    36	        text/xml
    37	        text/x-component
    38	        application/json
    39	        application/javascript
    40	        application/x-javascript
    41	        application/xml
    42	        application/xhtml+xml
    43	        application/atom+xml
    44	        application/rss+xml
    45	        application/ld+json
    46	        application/manifest+json
    47	        application/wasm
    48	        font/woff
    49	        font/woff2
    50	        image/svg+xml
    51	        image/x-icon;
    52	
    53	    # ── Static root ────────────────────────────────────────────────────────
    54	    root /home/cybersec/cybersec-pro/frontend/out;
    55	    index index.html;
    56	
    57	    # ── Root → EN homepage (app.cyber-sec-pro.com → dashboard landing) ─
    58	    location = / {
    59	        if ($host = app.cyber-sec-pro.com) {
    60	            rewrite ^ /dashboard/ last;
    61	        }
    62	        try_files /en/index.html =404;
    63	    }
    64	
    65	    # ── Per-host robots.txt / sitemap.xml ──────────────────────────────────
    66	    # app.cyber-sec-pro.com gets the SaaS sitemap; other hosts fall through
    67	    # to the marketing site root (frontend/out).
    68	    location = /robots.txt {
    69	        if ($host = app.cyber-sec-pro.com) {
    70	            rewrite ^ /dashboard/robots.txt last;
    71	        }
    72	        try_files $uri =404;
    73	    }
    74	
    75	    location = /sitemap.xml {
    76	        if ($host = app.cyber-sec-pro.com) {
    77	            rewrite ^ /dashboard/sitemap.xml last;
    78	        }
    79	        try_files $uri =404;
    80	    }
    81	
    82	    # ── .well-known (security.txt, pgp-key.txt) ─────────────────────────
    location ^~ /.well-known/ {
        root /home/cybersec/cybersec-pro/frontend/public;
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── Next.js static assets (immutable cache) ────────────────────────────
    83	    location /_next/ {
    84	        expires 1y;
    85	        add_header Cache-Control "public, immutable";
    86	        add_header X-Content-Type-Options "nosniff" always;
    87	        gzip_static on;
    88	        try_files $uri =404;
    89	    }
    90	
    91	    # ── Dashboard SPA ──────────────────────────────────────────────────────
    92	    location ^~ /dashboard/ {
    93	        alias /home/cybersec/cybersec-pro/saas-frontend/dist/;
    94	        index index.html;
    95	        try_files $uri $uri/ /dashboard/index.html;
    96	        add_header Cache-Control "no-cache, no-store, must-revalidate";
    97	    }
    98	
    99	    location = /dashboard {
   100	        return 301 /dashboard/;
   101	    }
   102	
   103	    # ── App Dashboard (alt path) ───────────────────────────────────────────
   104	    location ^~ /app/ {
   105	        alias /home/cybersec/cybersec-pro/saas-frontend/dist/;
   106	        index index.html;
   107	        try_files $uri $uri/ /app/index.html;
   108	        add_header Cache-Control "no-cache, no-store, must-revalidate";
   109	    }
   110	
   111	    location = /app {
   112	        return 301 /app/;
   113	    }
   114	
   115	    # ── OAuth callback ─────────────────────────────────────────────────────
   116	    location = /auth/callback {
   117	        default_type text/html;
   118	        alias /home/cybersec/cybersec-pro/saas-frontend/dist/index.html;
   119	    }
   120	
   121	    # ── Locale redirects ───────────────────────────────────────────────────
   122	    location ~ ^/(tools|docs|api-reference|about|blog|careers|contact|privacy|terms|security|success|tests|admin)(/?)$ {
   123	        return 302 /en/$1/;
   124	    }
   125	
   126	    # ── Tool detail pages (slug redirect to locale) ────────────────────────
   127	    location ~ ^/tools/([^/]+)(/?)$ {
   128	        return 302 /en/tools/$1/;
   129	    }
   130	
   131	    location = /login {
   132	        return 302 /dashboard/login;
   133	    }
   134	
   135	    # ── WebSocket (scan streaming) ─────────────────────────────────────────
   136	    location /socket.io/ {
   137	        proxy_pass             http://127.0.0.1:5001/socket.io/;
   138	        proxy_http_version     1.1;
   139	        proxy_set_header       Upgrade $http_upgrade;
   140	        proxy_set_header       Connection "upgrade";
   141	        proxy_set_header       Host $host;
   142	        proxy_set_header       X-Real-IP $remote_addr;
   143	        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
   144	        proxy_set_header       X-Forwarded-Proto $scheme;
   145	        proxy_read_timeout     86400;
   146	        proxy_send_timeout     86400;
   147	        proxy_buffering        off;
   148	        proxy_cache            off;
   149	    }
   150	
   151	    # ── API Backend v1 (SSE scan streaming) ───────────────────────────────
   152	    location /api/v1/ {
   153	        proxy_pass             http://127.0.0.1:5001/api/v1/;
   154	        proxy_http_version     1.1;
   155	        proxy_set_header       Upgrade $http_upgrade;
   156	        proxy_set_header       Host $host;
   157	        proxy_set_header       X-Real-IP $remote_addr;
   158	        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
   159	        proxy_set_header       X-Forwarded-Proto $scheme;
   160	        proxy_read_timeout     86400;
   161	        proxy_connect_timeout  60;
   162	        proxy_send_timeout   86400;
   163	        proxy_buffering        off;
   164	        proxy_cache            off;
   165	        client_max_body_size   10m;
   166	          chunked_transfer_encoding on;
   167	          add_header             X-Accel-Buffering no always;
   168	
   169	        add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com" always;
   170	        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
   171	        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
   172	
   173	        if ($request_method = 'OPTIONS') {
   174	            add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com";
   175	            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
   176	            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
   177	            add_header Content-Length 0;
   178	            add_header Content-Type text/plain;
   179	            return 204;
   180	        }
   181	    }
   182	
   183	    # ── API Backend v2 ─────────────────────────────────────────────────────
   184	    location /api/v2/ {
   185	        proxy_pass             http://127.0.0.1:5001/api/v2/;
   186	        proxy_http_version     1.1;
   187	        proxy_set_header       Upgrade $http_upgrade;
   188	        proxy_set_header       Connection 'upgrade';
   189	        proxy_set_header       Host $host;
   190	        proxy_set_header       X-Real-IP $remote_addr;
   191	        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
   192	        proxy_set_header       X-Forwarded-Proto $scheme;
   193	        proxy_read_timeout     600;
   194	        proxy_buffering        off;
   195	        proxy_cache            off;
   196	        client_max_body_size   10m;
   197	    }
   198	
   199	    # ── API Backend generic ────────────────────────────────────────────────
   200	    location /api/ {
   201	        proxy_pass             http://127.0.0.1:5001;
   202	        proxy_http_version     1.1;
   203	        proxy_set_header       Upgrade $http_upgrade;
   204	        proxy_set_header       Connection 'upgrade';
   205	        proxy_set_header       Host $host;
   206	        proxy_set_header       X-Real-IP $remote_addr;
   207	        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
   208	        proxy_set_header       X-Forwarded-Proto $scheme;
   209	        proxy_cache_bypass     $http_upgrade;
   210	        proxy_read_timeout     90;
   211	        client_max_body_size   10m;
   212	
   213	        add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com" always;
   214	        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
   215	        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
   216	
   217	        if ($request_method = 'OPTIONS') {
   218	            add_header Access-Control-Allow-Origin  "https://cyber-sec-pro.com";
   219	            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
   220	            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
   221	            add_header Content-Length 0;
   222	            add_header Content-Type text/plain;
   223	            return 204;
   224	        }
   225	    }
   226	
   227	    # ── Next.js locale pages ───────────────────────────────────────────────
   228	    # Force HTTPS in any redirects nginx generates (avoids https→http downgrade
   229	    # when behind Cloudflare/TLS terminator).
   230	    absolute_redirect off;
   231	    port_in_redirect off;
   232	
   233	    # HOTFIX: a fullscreen <canvas data-engine="three.js"> in the hero section
   234	    # was eating pointer events across the whole viewport (including over the
   235	    # footer), making footer links un-clickable. Inject a global CSS rule that
   236	    # neutralises pointer events on every three.js canvas. Removed once the
   237	    # rebuilt frontend with the in-component fix is deployed.
   238	    sub_filter '</head>' '<style>canvas[data-engine^="three.js"]{pointer-events:none!important}</style></head>';
   239	    sub_filter_once on;
   240	    sub_filter_types text/html;
   241	

    location / {
   243	        expires 1h;
   244	        add_header Cache-Control "public, must-revalidate";
   245	        # NOTE: $uri/ removed — its presence makes nginx auto-redirect 301 to
   246	        # add a trailing slash whenever the path is a directory, which broke
   247	        # all footer links (e.g. /en/privacy → /en/privacy/). Trying
   248	        # $uri/index.html directly serves the page without any redirect.
   249	        try_files $uri $uri/index.html =404;
   250	    
}
