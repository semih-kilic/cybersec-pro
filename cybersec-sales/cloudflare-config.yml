# Cloudflare Tunnel Configuration
# ~/.cloudflared/config.yml

tunnel: TUNNEL_ID_BURAYA  # cloudflared tunnel create sonucu
credentials-file: /home/sam/.cloudflared/TUNNEL_ID_BURAYA.json

ingress:
  # Ana site - Frontend
  - hostname: semihkilic.com
    service: http://localhost:8080
  
  # API Backend
  - hostname: semihkilic.com
    path: /api/*
    service: http://localhost:5002
  
  # Downloads
  - hostname: semihkilic.com
    path: /downloads/*
    service: http://localhost:8080
    
  # Catch-all (zorunlu)
  - service: http_status:404
