# CyberSec Pro - Nginx Configuration
# semihkilic.com - Cloud SaaS Platform

server {
    listen 80;
    server_name semihkilic.com www.semihkilic.com;

    # SSL will be configured by certbot and can add HTTPS blocks.

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend (Static files)
    root /home/cybersec/cybersec-pro/cybersec-sales/frontend;
    index index.html;

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tools Catalog Page
    location = /tools {
        try_files /tools.html =404;
    }

    # Tool Detail Pages - /tools/nmap, /tools/nikto, etc.
    location ~ ^/tools/([a-zA-Z0-9_-]+)$ {
        try_files /tool-detail.html =404;
    }

    # API Backend (Port 5002 for sales, Port 5001 for SaaS tools API)
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # SaaS Tools API (Port 5001)
    location /api/v1/tools/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }

    # SaaS Scans API (Port 5001)
    location /api/v1/scans/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600;
    }

    # Downloads
    location /downloads/ {
        alias /home/cybersec/cybersec-pro/cybersec-sales/downloads/;
        autoindex off;
    }

    # Install script
    location /install.sh {
        alias /home/cybersec/cybersec-pro/cybersec-sales/downloads/install.sh;
        default_type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Logs
    access_log /var/log/nginx/cybersec-access.log;
    error_log /var/log/nginx/cybersec-error.log;
}
