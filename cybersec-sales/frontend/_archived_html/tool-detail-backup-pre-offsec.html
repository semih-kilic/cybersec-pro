        // Get tool slug from URL
        const pathParts = window.location.pathname.split('/');
        const toolSlug = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

        // Load tool data
        function loadTool() {
            const tool = TOOLS_DB[toolSlug];
            
            if (!tool) {
                // Tool not found
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('tool-content').classList.remove('hidden');
                document.getElementById('tool-content').innerHTML = `
                    <div class="max-w-4xl mx-auto px-4 text-center py-20">

        function renderToolPage(tool) {
            const planColors = {
                starter: { bg: 'green-500/20', text: 'green-400', label: 'FREE' },
                professional: { bg: 'purple-500/20', text: 'purple-400', label: 'PRO' },
                enterprise: { bg: 'yellow-500/20', text: 'yellow-400', label: 'ENTERPRISE' }
            };
            const plan = planColors[tool.plan];
            const paramCount = Object.values(tool.parameters).flat().length;

            return `
                <!-- Breadcrumb & Header -->
                <div class="bg-gradient-to-b from-dark-card to-transparent border-b border-dark-border">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                        <!-- Breadcrumb -->
                        <div class="text-sm text-gray-400 mb-6">
                            <a href="/tools" class="hover:text-cyber-cyan">Tools</a>
                            <span class="mx-2">/</span>
                            <span class="text-gray-500">${tool.category}</span>

                            <span class="text-white">${tool.name}</span>
                        </div>

                        <div class="flex items-start gap-6">
                            <!-- Icon -->
                            <div class="w-20 h-20 bg-gradient-to-br from-cyber-cyan/20 to-cyber-blue/20 rounded-2xl flex items-center justify-center text-4xl flex-shrink-0 shadow-lg shadow-cyber-cyan/10">

                                </div>
                                <p class="text-xl text-gray-300 mb-4">${tool.description}</p>
                                <div class="flex flex-wrap gap-2">
                                    ${tool.tags.map(tag => `<span class="px-2 py-1 bg-dark-border rounded text-xs text-gray-400">#${tag}</span>`).join('')}
                                </div>
                            </div>

                            <!-- Quick Links -->
                            <div class="flex flex-col gap-2">
                                ${tool.homepage ? `<a href="${tool.homepage}" target="_blank" class="px-4 py-2 bg-dark-border hover:bg-dark-card rounded-lg text-sm flex items-center gap-2"><span>🌐</span> Homepage</a>` : ''}
                                ${tool.docs ? `<a href="${tool.docs}" target="_blank" class="px-4 py-2 bg-dark-border hover:bg-dark-card rounded-lg text-sm flex items-center gap-2"><span>📖</span> Docs</a>` : ''}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="border-b border-dark-border bg-dark-card/30 sticky top-16 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6">
                        <nav class="flex gap-1" id="tabs">
                            <button onclick="showTab('overview')" class="tab-btn active px-6 py-4 font-medium text-cyber-cyan border-b-2 border-cyber-cyan">Overview</button>
                            <button onclick="showTab('parameters')" class="tab-btn px-6 py-4 font-medium text-gray-400 hover:text-white border-b-2 border-transparent">Parameters (${paramCount})</button>
                            <button onclick="showTab('execute')" class="tab-btn px-6 py-4 font-medium text-gray-400 hover:text-white border-b-2 border-transparent">Execute</button>
                            <button onclick="showTab('examples')" class="tab-btn px-6 py-4 font-medium text-gray-400 hover:text-white border-b-2 border-transparent">Examples</button>
                            <button onclick="showTab('presets')" class="tab-btn px-6 py-4 font-medium text-gray-400 hover:text-white border-b-2 border-transparent">Presets</button>
                        </nav>
                    </div>
                </div>

                <!-- Tab Content -->
                <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                    <!-- Overview Tab -->
                    <div id="tab-overview" class="tab-content">
                        <div class="grid lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-8">
                                <!-- Description -->
                                <section>
                                    <h2 class="text-2xl font-bold mb-4">Description</h2>
                                    <div class="prose prose-invert max-w-none">
                                        <p class="text-gray-300 whitespace-pre-line leading-relaxed">${tool.longDescription}</p>
                                    </div>
                                </section>

                                <!-- Installation -->
                                <section>
                                    <h2 class="text-2xl font-bold mb-4">Installation</h2>
                                    <div class="code-block rounded-xl p-4 flex items-center justify-between">
                                        <code class="text-green-400">$ ${tool.installation}</code>
                                        <button onclick="copyToClipboard('${tool.installation}')" class="text-gray-400 hover:text-white transition">📋</button>
                                    </div>
                                </section>

                                <!-- Syntax -->
                                <section>
                                    <h2 class="text-2xl font-bold mb-4">Basic Syntax</h2>
                                    <div class="code-block rounded-xl p-4">
                                        <code class="text-cyber-cyan">${tool.syntax}</code>
                                    </div>
                                </section>
                            </div>

                            <!-- Sidebar -->
                            <div class="space-y-6">
                                <!-- Tool Info -->
                                <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                                    <h3 class="font-semibold mb-4">Tool Info</h3>
                                    <dl class="space-y-3 text-sm">
                                        ${tool.author ? `<div class="flex justify-between"><dt class="text-gray-400">Author</dt><dd>${tool.author}</dd></div>` : ''}
                                        ${tool.license ? `<div class="flex justify-between"><dt class="text-gray-400">License</dt><dd>${tool.license}</dd></div>` : ''}
                                        <div class="flex justify-between"><dt class="text-gray-400">Category</dt><dd>${tool.category}</dd></div>
                                        ${tool.subcategory ? `<div class="flex justify-between"><dt class="text-gray-400">Subcategory</dt><dd>${tool.subcategory}</dd></div>` : ''}
                                        <div class="flex justify-between"><dt class="text-gray-400">Parameters</dt><dd class="text-cyber-cyan font-bold">${paramCount}</dd></div>
                                        <div class="flex justify-between"><dt class="text-gray-400">Presets</dt><dd class="text-cyber-cyan font-bold">${tool.presets?.length || 0}</dd></div>
                                    </dl>
                                </div>

                                <!-- Related Tools -->
                                ${tool.relatedTools?.length ? `
                                <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                                    <h3 class="font-semibold mb-4">Related Tools</h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${tool.relatedTools.map(rt => `<a href="/tools/${rt}" class="px-3 py-1 bg-dark-border hover:bg-dark-bg rounded-lg text-sm transition">${rt}</a>`).join('')}
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Parameters Tab -->
                    <div id="tab-parameters" class="tab-content hidden">
                        <div class="space-y-8">
                            ${Object.entries(tool.parameters).map(([category, params]) => `
                                <section class="bg-dark-card rounded-xl overflow-hidden border border-dark-border">
                                    <div class="bg-dark-border/50 px-6 py-4">
                                        <h3 class="text-lg font-semibold">${category}</h3>
                                    </div>
                                    <div class="divide-y divide-dark-border">
                                        ${params.map(param => `
                                            <div class="param-row p-6 transition-colors">
                                                <div class="flex items-start gap-4">
                                                    <div class="flex-1">
                                                        <div class="flex items-center gap-3 mb-2">
                                                            <code class="px-2 py-1 bg-cyber-cyan/20 text-cyber-cyan rounded font-mono text-sm">${param.flag}</code>
                                                            <span class="font-medium">${param.name}</span>
                                                            ${param.required ? '<span class="px-2 py-0.5 bg-red-500/20 text-red-400 rounded text-xs">Required</span>' : ''}
                                                            ${param.popular ? '<span class="px-2 py-0.5 bg-green-500/20 text-green-400 rounded text-xs">Popular</span>' : ''}
                                                            <span class="px-2 py-0.5 bg-dark-border text-gray-400 rounded text-xs">${param.type}</span>
                                                        </div>
                                                        <p class="text-gray-400">${param.desc}</p>
                                                        ${param.example ? `<div class="mt-2 text-sm"><span class="text-gray-500">Example:</span> <code class="text-cyber-cyan">${param.example}</code></div>` : ''}
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Execute Tab -->
                    <div id="tab-execute" class="tab-content hidden">
                        <div class="grid lg:grid-cols-2 gap-8">
                            <!-- Form -->
                            <div class="space-y-6">
                                <h2 class="text-2xl font-bold">Configure Scan</h2>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Target <span class="text-red-400">*</span></label>
                                    <input type="text" id="exec-target" placeholder="e.g., 192.168.1.1 or example.com" class="w-full px-4 py-3 bg-dark-card border border-dark-border rounded-lg focus:border-cyber-cyan focus:ring-1 focus:ring-cyber-cyan outline-none transition">
                                </div>

                                <!-- Quick Options -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Quick Options</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        ${Object.values(tool.parameters).flat().filter(p => p.popular).slice(0, 6).map(param => `
                                            <label class="flex items-center gap-2 p-3 bg-dark-card border border-dark-border rounded-lg cursor-pointer hover:border-cyber-cyan/50 transition">
                                                <input type="checkbox" class="param-checkbox w-4 h-4 rounded bg-dark-border border-dark-border text-cyber-cyan focus:ring-cyber-cyan" data-flag="${param.flag}">
                                                <span class="text-sm">${param.name}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- Generated Command -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Generated Command</label>
                                    <div class="code-block rounded-xl p-4">
                                        <code id="generated-command" class="text-green-400">$ ${tool.slug} {target}</code>
                                    </div>
                                </div>

                                <!-- Execute Button -->
                                <button id="execute-btn" onclick="executeScan()" class="w-full py-4 rounded-xl font-semibold kali-btn text-lg">
                                    🚀 Execute Scan
                                </button>
                                <p class="text-center text-gray-500 text-sm">Requires login • Results saved automatically</p>
                            </div>

                            <!-- Output -->
                            <div class="space-y-4">
                                <h2 class="text-2xl font-bold">Output</h2>
                                <div class="code-block rounded-xl p-4 h-[500px] overflow-y-auto">
                                    <pre id="scan-output" class="text-green-400 text-sm whitespace-pre-wrap"># Output will appear here after running a scan
# Make sure to enter a target and click Execute

# Note: You need to be logged in to execute scans
# Sign up for free at /register</pre>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Examples Tab -->
                    <div id="tab-examples" class="tab-content hidden">
                        <h2 class="text-2xl font-bold mb-6">Usage Examples</h2>
                        <div class="grid gap-4">
                            ${(tool.examples || []).map(ex => `
                                <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                                    <h3 class="text-lg font-semibold mb-2">${ex.title}</h3>
                                    <p class="text-gray-400 mb-4">${ex.desc}</p>
                                    <div class="code-block rounded-lg p-4 flex items-center justify-between">
                                        <code class="text-green-400">$ ${ex.command}</code>
                                        <button onclick="copyToClipboard('${ex.command}')" class="text-gray-400 hover:text-white transition">📋</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Presets Tab -->
                    <div id="tab-presets" class="tab-content hidden">
                        <h2 class="text-2xl font-bold mb-6">Predefined Presets</h2>
                        <p class="text-gray-400 mb-8">Ready-to-use parameter combinations for common use cases</p>
                        
                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${(tool.presets || []).map(preset => `
                                <div class="bg-dark-card rounded-xl p-6 border border-dark-border hover:border-cyber-cyan/50 transition">
                                    <div class="flex items-start justify-between mb-3">
                                        <h3 class="text-lg font-semibold">${preset.name}</h3>
                                        <span class="px-2 py-1 rounded text-xs ${
                                            preset.difficulty === 'beginner' ? 'bg-green-500/20 text-green-400' :
                                            preset.difficulty === 'intermediate' ? 'bg-yellow-500/20 text-yellow-400' :
                                            'bg-red-500/20 text-red-400'
                                        }">${preset.difficulty}</span>
                                    </div>
                                    <p class="text-gray-400 text-sm mb-4">${preset.desc}</p>
                                    <div class="code-block rounded-lg p-3 text-xs mb-4">
                                        <code class="text-green-400">${preset.command}</code>
                                    </div>
                                    <button onclick="usePreset('${preset.command}')" class="w-full py-2 bg-cyber-cyan/20 hover:bg-cyber-cyan/30 text-cyber-cyan rounded-lg text-sm font-medium transition">
                                        Use This Preset →
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Tab switching
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'text-cyber-cyan', 'border-cyber-cyan');
                btn.classList.add('text-gray-400', 'border-transparent');
            });

            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            event.target.classList.add('active', 'text-cyber-cyan', 'border-cyber-cyan');
            event.target.classList.remove('text-gray-400', 'border-transparent');
        }

        // Copy to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            // Show toast
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50';
            toast.textContent = 'Copied to clipboard!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // Use preset
        function usePreset(command) {
            showTab('execute');
            document.getElementById('generated-command').textContent = `$ ${command}`;
        }

        // Execute scan
        function executeScan() {
            const target = document.getElementById('exec-target').value;
            if (!target) {
                alert('Please enter a target');
                return;
            }

            const output = document.getElementById('scan-output');
            output.textContent = `# Starting scan against ${target}...\n\n`;
            
            // Simulate scan output
            let lines = [
                `[*] Initializing ${TOOLS_DB[toolSlug].name}...`,
                `[*] Target: ${target}`,
                `[*] Starting scan at ${new Date().toISOString()}`,
                '',
                '[+] Running scan...',
                '',
                '# Note: This is a demo. In production, you would see actual scan results.',
                '# Login to your account to run real scans.',
                '',
                '[*] Scan complete.'
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < lines.length) {
                    output.textContent += lines[i] + '\n';
                    output.scrollTop = output.scrollHeight;
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, 300);
        }

        // Update generated command
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('param-checkbox')) {
                updateGeneratedCommand();
            }
        });

        function updateGeneratedCommand() {
            const tool = TOOLS_DB[toolSlug];
            const target = document.getElementById('exec-target')?.value || '{target}';
            const checkboxes = document.querySelectorAll('.param-checkbox:checked');
            
            let flags = [];
            checkboxes.forEach(cb => {
                flags.push(cb.dataset.flag);
            });

            const command = `${tool.slug} ${flags.join(' ')} ${target}`.trim();
            const commandEl = document.getElementById('generated-command');
            if (commandEl) {
                commandEl.textContent = `$ ${command}`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadTool);
    </script>
</body>
</html>
