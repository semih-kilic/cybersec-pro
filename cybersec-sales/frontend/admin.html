<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Pro - Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/favicon.svg" color="#00d4ff">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#0a0a0f', card: '#12121a', border: '#1e1e2e' },
                        cyber: { cyan: '#00d4ff', blue: '#0066ff' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-white min-h-screen">
    <div id="app">
        <!-- Login Form -->
        <div id="loginForm" class="min-h-screen flex items-center justify-center p-6">
            <div class="bg-dark-card rounded-2xl p-8 border border-dark-border w-full max-w-md">
                <h1 class="text-2xl font-bold mb-6 text-center">🛡️ Admin Panel</h1>
                <div class="space-y-4">
                    <input type="password" id="adminToken" placeholder="Admin Token" 
                        class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 focus:border-cyber-cyan focus:outline-none">
                    <button onclick="login()" 
                        class="w-full py-3 rounded-xl bg-gradient-to-r from-cyber-cyan to-cyber-blue font-medium hover:opacity-90">
                        Login
                    </button>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="dashboard" class="hidden">
            <!-- Header -->
            <header class="bg-dark-card border-b border-dark-border px-6 py-4">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <h1 class="text-xl font-bold">🛡️ CyberSec Pro Admin</h1>
                    <button onclick="logout()" class="text-gray-400 hover:text-white">Logout</button>
                </div>
            </header>

            <main class="max-w-7xl mx-auto p-6">
                <!-- Stats -->
                <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                        <div class="text-3xl font-bold text-cyber-cyan" id="statCustomers">0</div>
                        <div class="text-gray-400">Customers</div>
                    </div>
                    <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                        <div class="text-3xl font-bold text-green-400" id="statLicenses">0</div>
                        <div class="text-gray-400">Active Licenses</div>
                    </div>
                    <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                        <div class="text-3xl font-bold text-purple-400" id="statOrders">0</div>
                        <div class="text-gray-400">Orders</div>
                    </div>
                    <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                        <div class="text-3xl font-bold text-yellow-400" id="statRevenue">$0</div>
                        <div class="text-gray-400">Revenue</div>
                    </div>
                </div>

                <!-- Create License -->
                <div class="bg-dark-card rounded-xl p-6 border border-dark-border mb-8">
                    <h2 class="text-lg font-bold mb-4">➕ Create New License</h2>
                    <div class="grid md:grid-cols-4 gap-4">
                        <input type="email" id="newEmail" placeholder="Customer Email" 
                            class="bg-dark-bg border border-dark-border rounded-xl px-4 py-3 focus:border-cyber-cyan focus:outline-none">
                        <input type="text" id="newName" placeholder="Customer Name" 
                            class="bg-dark-bg border border-dark-border rounded-xl px-4 py-3 focus:border-cyber-cyan focus:outline-none">
                        <select id="newPlan" class="bg-dark-bg border border-dark-border rounded-xl px-4 py-3 focus:border-cyber-cyan focus:outline-none">
                            <option value="basic">Basic ($49)</option>
                            <option value="professional" selected>Professional ($149)</option>
                            <option value="enterprise">Enterprise ($499)</option>
                        </select>
                        <button onclick="createLicense()" 
                            class="py-3 rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 font-medium hover:opacity-90">
                            Create & Send
                        </button>
                    </div>
                    <div id="createMessage" class="mt-4 hidden"></div>
                </div>

                <!-- Licenses Table -->
                <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
                    <h2 class="text-lg font-bold mb-4">🔑 Licenses</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="text-left text-gray-400 border-b border-dark-border">
                                    <th class="pb-3">Key</th>
                                    <th class="pb-3">Customer</th>
                                    <th class="pb-3">Plan</th>
                                    <th class="pb-3">Status</th>
                                    <th class="pb-3">Expires</th>
                                    <th class="pb-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="licensesTable">
                                <tr><td colspan="6" class="text-center py-8 text-gray-400">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let adminToken = localStorage.getItem('adminToken') || '';

        // Check if already logged in
        if (adminToken) {
            showDashboard();
        }

        function login() {
            adminToken = document.getElementById('adminToken').value;
            localStorage.setItem('adminToken', adminToken);
            showDashboard();
        }

        function logout() {
            adminToken = '';
            localStorage.removeItem('adminToken');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadStats();
            loadLicenses();
        }

        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': adminToken
                }
            };
            if (data) options.body = JSON.stringify(data);
            
            const response = await fetch(API_URL + endpoint, options);
            if (response.status === 401) {
                logout();
                alert('Invalid token');
                return null;
            }
            return response.json();
        }

        async function loadStats() {
            const data = await apiCall('/admin/stats');
            if (data) {
                document.getElementById('statCustomers').textContent = data.customers || 0;
                document.getElementById('statLicenses').textContent = data.licenses?.active || 0;
                document.getElementById('statOrders').textContent = data.orders || 0;
                document.getElementById('statRevenue').textContent = '$' + (data.revenue || 0);
            }
        }

        async function loadLicenses() {
            const data = await apiCall('/admin/licenses');
            if (data && data.licenses) {
                const tbody = document.getElementById('licensesTable');
                if (data.licenses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">No licenses yet</td></tr>';
                    return;
                }
                tbody.innerHTML = data.licenses.map(l => `
                    <tr class="border-b border-dark-border">
                        <td class="py-3 font-mono text-sm">${l.key}</td>
                        <td class="py-3">${l.customer_email || '-'}</td>
                        <td class="py-3">
                            <span class="px-2 py-1 rounded-full text-xs ${
                                l.plan === 'enterprise' ? 'bg-yellow-500/20 text-yellow-400' :
                                l.plan === 'professional' ? 'bg-purple-500/20 text-purple-400' :
                                'bg-blue-500/20 text-blue-400'
                            }">${l.plan}</span>
                        </td>
                        <td class="py-3">
                            <span class="px-2 py-1 rounded-full text-xs ${
                                l.status === 'active' ? 'bg-green-500/20 text-green-400' :
                                l.status === 'expired' ? 'bg-red-500/20 text-red-400' :
                                'bg-gray-500/20 text-gray-400'
                            }">${l.status}</span>
                        </td>
                        <td class="py-3 text-sm">${l.days_left ? l.days_left + ' days' : '-'}</td>
                        <td class="py-3">
                            <button onclick="resetLicense(${l.id})" class="text-cyber-cyan hover:underline text-sm mr-3">Reset</button>
                            <button onclick="revokeLicense(${l.id})" class="text-red-400 hover:underline text-sm">Revoke</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        async function createLicense() {
            const email = document.getElementById('newEmail').value;
            const name = document.getElementById('newName').value;
            const plan = document.getElementById('newPlan').value;

            if (!email) {
                showMessage('createMessage', 'Please enter an email', 'error');
                return;
            }

            const data = await apiCall('/admin/licenses', 'POST', { email, name, plan });
            if (data && data.success) {
                showMessage('createMessage', `License created: ${data.license.key}`, 'success');
                document.getElementById('newEmail').value = '';
                document.getElementById('newName').value = '';
                loadLicenses();
                loadStats();
            } else {
                showMessage('createMessage', data?.error || 'Failed to create license', 'error');
            }
        }

        async function resetLicense(id) {
            if (confirm('Reset this license? This will allow re-activation on a new device.')) {
                await apiCall(`/admin/licenses/${id}/reset`, 'POST');
                loadLicenses();
            }
        }

        async function revokeLicense(id) {
            if (confirm('Revoke this license? This cannot be undone.')) {
                await apiCall(`/admin/licenses/${id}/revoke`, 'POST');
                loadLicenses();
                loadStats();
            }
        }

        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.className = `mt-4 p-3 rounded-lg ${type === 'success' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`;
            el.textContent = text;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }
    </script>
</body>
</html>
