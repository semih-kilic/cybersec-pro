<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberSec Pro</title>
    <meta name="description" content="Access your CyberSec Pro account. Manage security tools, projects, and reports.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kali': { 'blue': '#367bf0', 'dark': '#1a1a2e', 'darker': '#0f0f1a', 'purple': '#9b59b6', 'cyan': '#00d4ff', 'green': '#2ecc71', 'red': '#e74c3c' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a12; }
        .kali-gradient { background: linear-gradient(135deg, #367bf0 0%, #9b59b6 100%); }
        .kali-text { background: linear-gradient(135deg, #367bf0, #9b59b6, #00d4ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .dragon-bg { background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(54, 123, 240, 0.2), transparent), radial-gradient(ellipse 60% 40% at 70% 70%, rgba(155, 89, 182, 0.15), transparent), #0a0a12; }
        .kali-card { background: linear-gradient(145deg, rgba(26, 26, 46, 0.9), rgba(15, 15, 26, 0.95)); border: 1px solid rgba(54, 123, 240, 0.2); }
        .btn-kali { background: linear-gradient(135deg, #367bf0 0%, #2563eb 100%); box-shadow: 0 10px 40px rgba(54, 123, 240, 0.3); }
        .btn-kali:hover { box-shadow: 0 15px 50px rgba(54, 123, 240, 0.5); transform: translateY(-2px); }
        .input-kali { background: rgba(15, 15, 26, 0.8); border: 1px solid rgba(54, 123, 240, 0.2); transition: all 0.3s ease; }
        .input-kali:focus { border-color: #367bf0; box-shadow: 0 0 0 3px rgba(54, 123, 240, 0.2); outline: none; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .dragon-float { animation: float 4s ease-in-out infinite; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(54, 123, 240, 0.7); } 50% { box-shadow: 0 0 0 15px rgba(54, 123, 240, 0); } }
        .pulse-kali { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body class="text-white antialiased min-h-screen dragon-bg flex flex-col">
    <!-- Minimal Nav -->
    <nav class="p-6">
        <a href="/" class="flex items-center gap-3 w-fit">
            <div class="relative">
                <div class="w-10 h-10 rounded-xl kali-gradient flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                </div>
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-kali-green rounded-full pulse-kali"></div>
            </div>
            <span class="text-xl font-bold">CyberSec Pro</span>
        </a>
    </nav>
    
    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 pb-12">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div class="kali-card rounded-3xl p-8" id="loginCard">
                <!-- Dragon Icon -->
                <div class="text-center mb-8">
                    <div class="text-6xl dragon-float mb-4">🐉</div>
                    <h1 class="text-2xl font-bold">Welcome Back</h1>
                    <p class="text-gray-400 mt-2">Sign in to your account</p>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input type="email" name="email" required
                            class="input-kali w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                            placeholder="you@example.com">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <input type="password" name="password" required
                            class="input-kali w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                            placeholder="••••••••">
                    </div>
                    
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="rounded bg-kali-darker border-kali-blue/30 text-kali-blue focus:ring-kali-blue">
                            <span class="text-gray-400">Remember me</span>
                        </label>
                        <a href="#" class="text-kali-blue hover:underline">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-kali w-full py-3.5 rounded-xl font-semibold text-white transition">
                        Sign In
                    </button>
                    
                    <div id="loginError" class="hidden text-kali-red text-center text-sm"></div>
                </form>
                
                <!-- Divider -->
                <div class="flex items-center gap-4 my-8">
                    <div class="flex-1 h-px bg-gradient-to-r from-transparent via-kali-blue/30 to-transparent"></div>
                    <span class="text-gray-500 text-sm">OR</span>
                    <div class="flex-1 h-px bg-gradient-to-r from-transparent via-kali-blue/30 to-transparent"></div>
                </div>
                
                <!-- Social Login -->
                <div class="space-y-3">
                    <button type="button" id="googleLoginBtn" class="oauth-btn w-full py-3 px-4 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition flex items-center justify-center gap-3">
                        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        <span>Continue with Google</span>
                    </button>
                    <button type="button" id="githubLoginBtn" class="oauth-btn w-full py-3 px-4 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition flex items-center justify-center gap-3">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        <span>Continue with GitHub</span>
                    </button>
                </div>
                
                <!-- Sign Up Link -->
                <p class="text-center text-gray-400 mt-8">
                    Don't have an account? 
                    <a href="#" onclick="showRegister()" class="text-kali-blue hover:underline font-medium">Start Free Trial</a>
                </p>
            </div>
            
            <!-- Register Card (Hidden) -->
            <div class="kali-card rounded-3xl p-8 hidden" id="registerCard">
                <div class="text-center mb-8">
                    <div class="text-6xl dragon-float mb-4">🐉</div>
                    <h1 class="text-2xl font-bold">Start Your <span class="kali-text">Free Trial</span></h1>
                    <p class="text-gray-400 mt-2">14 days free • No credit card required</p>
                </div>
                
                <form id="registerForm" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                            <input type="text" name="firstName" required
                                class="input-kali w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                                placeholder="John">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                            <input type="text" name="lastName" required
                                class="input-kali w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                                placeholder="Doe">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input type="email" name="email" required
                            class="input-kali w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                            placeholder="you@company.com">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <input type="password" name="password" required minlength="8"
                            class="input-kali w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                            placeholder="At least 8 characters">
                    </div>
                    
                    <div>
                        <label class="flex items-start gap-2 cursor-pointer">
                            <input type="checkbox" required class="mt-1 rounded bg-kali-darker border-kali-blue/30 text-kali-blue focus:ring-kali-blue">
                            <span class="text-sm text-gray-400">
                                I agree to the <a href="/terms.html" class="text-kali-blue hover:underline">Terms of Service</a> 
                                and <a href="/privacy.html" class="text-kali-blue hover:underline">Privacy Policy</a>
                            </span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-kali w-full py-3.5 rounded-xl font-semibold text-white transition">
                        Create Account
                    </button>
                    
                    <div id="registerError" class="hidden text-kali-red text-center text-sm"></div>
                    <div id="registerSuccess" class="hidden text-kali-green text-center text-sm"></div>
                </form>
                
                <p class="text-center text-gray-400 mt-8">
                    Already have an account? 
                    <a href="#" onclick="showLogin()" class="text-kali-blue hover:underline font-medium">Sign In</a>
                </p>
            </div>
        </div>
    </main>
    
    <!-- Features -->
    <section class="py-8 px-4 bg-kali-darker/50">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-center gap-8 text-sm text-gray-400">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-kali-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span>165+ Security Tools</span>
            </div>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-kali-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span>No Installation</span>
            </div>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-kali-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span>Cancel Anytime</span>
            </div>
        </div>
    </section>
    
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
        // API URL - always use same origin for API requests (nginx proxies to backend)
        const API_URL = '';  // Empty means same origin - /api/v1/ will be proxied by nginx
        
        // OAuth Configuration (will be loaded from API)
        let oauthConfig = { google: { enabled: false }, github: { enabled: false } };
        let oauthInitialized = false;
        
        // Load OAuth config on page load
        async function loadOAuthConfig() {
            try {
                console.log('Loading OAuth config...');
                const res = await fetch(`${API_URL}/api/v1/auth/oauth-config`);
                if (res.ok) {
                    oauthConfig = await res.json();
                    console.log('OAuth config loaded:', oauthConfig);
                    initializeOAuth();
                }
            } catch (err) {
                console.log('OAuth config not available:', err);
            }
        }
        
        // Initialize OAuth buttons
        function initializeOAuth() {
            if (oauthInitialized) return;
            oauthInitialized = true;
            
            console.log('Initializing OAuth buttons...');
            
            // Google OAuth
            const googleBtn = document.getElementById('googleLoginBtn');
            if (googleBtn) {
                googleBtn.onclick = function(e) {
                    e.preventDefault();
                    console.log('Google button clicked, config:', oauthConfig.google);
                    if (oauthConfig.google.enabled && oauthConfig.google.client_id) {
                        if (typeof google !== 'undefined' && google.accounts) {
                            google.accounts.id.initialize({
                                client_id: oauthConfig.google.client_id,
                                callback: handleGoogleResponse
                            });
                            google.accounts.id.prompt((notification) => {
                                console.log('Google prompt notification:', notification);
                                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                    // Fallback: redirect to Google OAuth
                                    const redirectUri = encodeURIComponent(window.location.origin + '/login');
                                    const googleUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${oauthConfig.google.client_id}&redirect_uri=${redirectUri}&response_type=code&scope=email%20profile&prompt=select_account`;
                                    window.location.href = googleUrl;
                                }
                            });
                        } else {
                            // Google SDK not loaded, use redirect flow
                            const redirectUri = encodeURIComponent(window.location.origin + '/login');
                            const googleUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${oauthConfig.google.client_id}&redirect_uri=${redirectUri}&response_type=code&scope=email%20profile&prompt=select_account`;
                            window.location.href = googleUrl;
                        }
                    } else {
                        alert('Google login is not configured yet. Please use email registration.');
                    }
                };
            }
            
            // GitHub OAuth
            const githubBtn = document.getElementById('githubLoginBtn');
            if (githubBtn) {
                githubBtn.onclick = function(e) {
                    e.preventDefault();
                    console.log('GitHub button clicked, config:', oauthConfig.github);
                    if (oauthConfig.github.enabled && oauthConfig.github.client_id) {
                        const redirectUri = encodeURIComponent(window.location.origin + '/auth/github/callback');
                        const githubUrl = `https://github.com/login/oauth/authorize?client_id=${oauthConfig.github.client_id}&redirect_uri=${redirectUri}&scope=user:email`;
                        console.log('Redirecting to:', githubUrl);
                        window.location.href = githubUrl;
                    } else {
                        alert('GitHub login is not configured yet. Please use email registration.');
                    }
                };
            }
            
            console.log('OAuth buttons initialized');
        }
        
        // Handle Google OAuth response
        async function handleGoogleResponse(response) {
            console.log('Google response received');
            try {
                const res = await fetch(`${API_URL}/api/v1/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/app/';
                } else {
                    alert(data.error || 'Google login failed');
                }
            } catch (err) {
                console.error('Google login error:', err);
                alert('Connection error. Please try again.');
            }
        }
        
        // Handle Google OAuth code from redirect
        async function handleGoogleOAuthCode(code) {
            console.log('Processing Google OAuth code...');
            try {
                const res = await fetch(`${API_URL}/api/v1/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // Clear URL params
                    window.history.replaceState({}, document.title, '/login');
                    window.location.href = '/app/';
                } else {
                    alert(data.error || 'Google login failed');
                    window.history.replaceState({}, document.title, '/login');
                }
            } catch (err) {
                console.error('Google OAuth error:', err);
                alert('Connection error. Please try again.');
                window.history.replaceState({}, document.title, '/login');
            }
        }
        
        // Check for OAuth code on page load and handle hash for register
        document.addEventListener('DOMContentLoaded', function() {
            // Check URL hash for register
            if (window.location.hash === '#register') {
                showRegister();
            }
            
            // Check for Google OAuth code
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code && !urlParams.get('state')) {
                // This is likely a Google OAuth redirect (no state = Google, GitHub uses callback page)
                handleGoogleOAuthCode(code);
            } else {
                // Normal page load - load OAuth config
                loadOAuthConfig();
            }
        });
        
        function showLogin() {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('registerCard').classList.add('hidden');
        }
        
        function showRegister() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
        }
        
        // Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');
            
            const errorDiv = document.getElementById('loginError');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            
            try {
                const res = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // Redirect to app dashboard
                    window.location.href = '/app/';
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
        
        // Register Form
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            const userData = {
                first_name: formData.get('firstName'),
                last_name: formData.get('lastName'),
                email: formData.get('email'),
                password: formData.get('password'),
                organization_name: formData.get('firstName') + "'s Workspace"
            };
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            try {
                const res = await fetch(`${API_URL}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    successDiv.textContent = 'Account created! Redirecting...';
                    successDiv.classList.remove('hidden');
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = '/app/';
                    }, 1500);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Register error:', err);
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
        
        // Check if coming for trial
        if (window.location.hash === '#register' || window.location.search.includes('trial')) {
            showRegister();
        }
    </script>
</body>
</html>
