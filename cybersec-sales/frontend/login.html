<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - CyberSec Pro</title>
    <meta name="description" content="Access your CyberSec Pro account. Manage security tools, projects, and reports.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a12;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background:
                radial-gradient(ellipse 80% 60% at 50% 30%, rgba(54, 123, 240, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 70% 70%, rgba(155, 89, 182, 0.1), transparent),
                #0a0a12;
        }
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }
        .nav {
            padding: 16px 24px;
            flex-shrink: 0;
        }
        .nav a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }
        .nav-logo {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #367bf0, #9b59b6);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .nav-logo svg { width: 20px; height: 20px; }
        .nav-dot {
            position: absolute; top: -3px; right: -3px;
            width: 8px; height: 8px;
            background: #2ecc71; border-radius: 50%;
            animation: pulse-glow 2s infinite;
        }
        .nav-title { font-size: 18px; font-weight: 700; }
        .center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            min-height: 0;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.92), rgba(15, 15, 26, 0.96));
            border: 1px solid rgba(54, 123, 240, 0.2);
            border-radius: 20px;
            padding: 28px 28px 24px;
        }
        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .dragon {
            font-size: 40px;
            animation: float 4s ease-in-out infinite;
            margin-bottom: 8px;
        }
        .card-header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .card-header p {
            color: #9ca3af;
            font-size: 13px;
            margin-top: 4px;
        }
        .kali-text {
            background: linear-gradient(135deg, #367bf0, #9b59b6, #00d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 5px;
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(54, 123, 240, 0.2);
            background: rgba(15, 15, 26, 0.8);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input::placeholder { color: #6b7280; }
        .form-input:focus {
            border-color: #367bf0;
            box-shadow: 0 0 0 3px rgba(54, 123, 240, 0.15);
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .form-row label {
            display: flex; align-items: center; gap: 6px;
            color: #9ca3af; cursor: pointer;
        }
        .form-row input[type="checkbox"] { accent-color: #367bf0; }
        .form-row a { color: #367bf0; text-decoration: none; }
        .form-row a:hover { text-decoration: underline; }
        .btn-primary {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #367bf0, #2563eb);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(54, 123, 240, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgba(54, 123, 240, 0.45);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-msg {
            display: none;
            text-align: center;
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
        }
        .error-msg.show { display: block; }
        .success-msg {
            display: none;
            text-align: center;
            color: #2ecc71;
            font-size: 13px;
            margin-top: 10px;
        }
        .success-msg.show { display: block; }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(54, 123, 240, 0.25), transparent);
        }
        .divider span {
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .oauth-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        .oauth-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .oauth-btn svg { width: 18px; height: 18px; }
        .bottom-link {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-top: 16px;
        }
        .bottom-link a {
            color: #367bf0;
            text-decoration: none;
            font-weight: 500;
        }
        .bottom-link a:hover { text-decoration: underline; }
        .footer-bar {
            flex-shrink: 0;
            padding: 10px 24px;
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 12px;
            color: #6b7280;
            background: rgba(15, 15, 26, 0.5);
        }
        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-item svg { width: 14px; height: 14px; color: #2ecc71; }
        .hidden { display: none !important; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .terms-label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .terms-label input { margin-top: 2px; accent-color: #367bf0; }
        .terms-label a { color: #367bf0; text-decoration: none; }
        .terms-label a:hover { text-decoration: underline; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); }
            50% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
        }
        @media (max-height: 700px) {
            .nav { padding: 10px 20px; }
            .card { padding: 20px 24px 18px; }
            .card-header { margin-bottom: 14px; }
            .dragon { font-size: 32px; margin-bottom: 4px; }
            .card-header h1 { font-size: 20px; }
            .form-group { margin-bottom: 10px; }
            .form-input { padding: 8px 12px; }
            .btn-primary { padding: 9px; }
            .divider { margin: 12px 0; }
            .oauth-btn { padding: 8px; }
            .bottom-link { margin-top: 10px; }
        }
        @media (max-height: 580px) {
            .dragon { display: none; }
            .card-header { margin-bottom: 10px; }
            .card-header h1 { font-size: 18px; }
            .footer-bar { display: none; }
        }
        @media (max-width: 480px) {
            .center { padding: 0 12px; }
            .card { padding: 22px 18px 18px; border-radius: 16px; }
            .footer-bar { gap: 16px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="page">
        <nav class="nav">
            <a href="/">
                <div class="nav-logo">
                    <svg viewBox="0 0 24 24" fill="white">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    <div class="nav-dot"></div>
                </div>
                <span class="nav-title">CyberSec Pro</span>
            </a>
        </nav>
        <div class="center">
            <div class="card" id="loginCard">
                <div class="card-header">
                    <div class="dragon">&#x1F409;</div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required class="form-input" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password">
                    </div>
                    <div class="form-row">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-primary">Sign In</button>
                    <div id="loginError" class="error-msg"></div>
                </form>
                <div class="divider"><span>or</span></div>
                <button type="button" id="googleLoginBtn" class="oauth-btn">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Continue with Google
                </button>
                <button type="button" id="githubLoginBtn" class="oauth-btn">
                    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    Continue with GitHub
                </button>
                <div class="bottom-link">
                    Don't have an account? <a href="#" onclick="showRegister()">Start Free Trial</a>
                </div>
            </div>
            <div class="card hidden" id="registerCard">
                <div class="card-header">
                    <div class="dragon">&#x1F409;</div>
                    <h1>Start Your <span class="kali-text">Free Trial</span></h1>
                    <p>14 days free &#8226; No credit card required</p>
                </div>
                <form id="registerForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="firstName" required class="form-input" placeholder="John">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="lastName" required class="form-input" placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required class="form-input" placeholder="you@company.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required minlength="8" class="form-input" placeholder="At least 8 characters" autocomplete="new-password">
                    </div>
                    <label class="terms-label">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a></span>
                    </label>
                    <button type="submit" class="btn-primary">Create Account</button>
                    <div id="registerError" class="error-msg"></div>
                    <div id="registerSuccess" class="success-msg"></div>
                </form>
                <div class="bottom-link">
                    Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
                </div>
            </div>
        </div>
        <div class="footer-bar">
            <div class="footer-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                682 Security Tools
            </div>
            <div class="footer-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                No Installation
            </div>
            <div class="footer-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Cancel Anytime
            </div>
        </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        var API_URL = '';
        var oauthConfig = { google: { enabled: false }, github: { enabled: false } };
        var oauthInitialized = false;

        async function loadOAuthConfig() {
            try {
                var res = await fetch(API_URL + '/api/v1/auth/oauth-config');
                if (res.ok) {
                    oauthConfig = await res.json();
                    initializeOAuth();
                }
            } catch (err) {
                console.log('OAuth config not available:', err);
            }
        }

        function initializeOAuth() {
            if (oauthInitialized) return;
            oauthInitialized = true;
            var googleBtn = document.getElementById('googleLoginBtn');
            if (googleBtn) {
                googleBtn.onclick = function(e) {
                    e.preventDefault();
                    if (oauthConfig.google.enabled && oauthConfig.google.client_id) {
                        if (typeof google !== 'undefined' && google.accounts) {
                            google.accounts.id.initialize({
                                client_id: oauthConfig.google.client_id,
                                callback: handleGoogleResponse
                            });
                            google.accounts.id.prompt(function(notification) {
                                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                    var redirectUri = encodeURIComponent(window.location.origin + '/login');
                                    window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + oauthConfig.google.client_id + '&redirect_uri=' + redirectUri + '&response_type=code&scope=email%20profile&prompt=select_account';
                                }
                            });
                        } else {
                            var redirectUri = encodeURIComponent(window.location.origin + '/login');
                            window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + oauthConfig.google.client_id + '&redirect_uri=' + redirectUri + '&response_type=code&scope=email%20profile&prompt=select_account';
                        }
                    } else {
                        alert('Google login is not configured yet.');
                    }
                };
            }
            var githubBtn = document.getElementById('githubLoginBtn');
            if (githubBtn) {
                githubBtn.onclick = function(e) {
                    e.preventDefault();
                    if (oauthConfig.github.enabled && oauthConfig.github.client_id) {
                        var redirectUri = encodeURIComponent(window.location.origin + '/auth/github/callback');
                        window.location.href = 'https://github.com/login/oauth/authorize?client_id=' + oauthConfig.github.client_id + '&redirect_uri=' + redirectUri + '&scope=user:email';
                    } else {
                        alert('GitHub login is not configured yet.');
                    }
                };
            }
        }

        async function handleGoogleResponse(response) {
            try {
                var res = await fetch(API_URL + '/api/v1/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                var data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/app/';
                } else {
                    alert(data.error || 'Google login failed');
                }
            } catch (err) {
                alert('Connection error. Please try again.');
            }
        }

        async function handleGoogleOAuthCode(code) {
            try {
                var redirectUri = window.location.origin + '/login';
                var res = await fetch(API_URL + '/api/v1/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, redirect_uri: redirectUri })
                });
                var data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.history.replaceState({}, document.title, '/login');
                    window.location.href = '/app/';
                } else {
                    alert(data.error || 'Google login failed');
                    window.history.replaceState({}, document.title, '/login');
                }
            } catch (err) {
                alert('Connection error. Please try again.');
                window.history.replaceState({}, document.title, '/login');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.hash === '#register') showRegister();
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            if (code && !urlParams.get('state')) {
                handleGoogleOAuthCode(code);
            } else {
                loadOAuthConfig();
            }
        });

        function showLogin() {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('registerCard').classList.add('hidden');
        }
        function showRegister() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var formData = new FormData(e.target);
            var email = formData.get('email');
            var password = formData.get('password');
            var errorDiv = document.getElementById('loginError');
            var submitBtn = e.target.querySelector('button[type="submit"]');
            errorDiv.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            try {
                var res = await fetch(API_URL + '/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                var data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/app/';
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials';
                    errorDiv.classList.add('show');
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var formData = new FormData(e.target);
            var errorDiv = document.getElementById('registerError');
            var successDiv = document.getElementById('registerSuccess');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            var userData = {
                first_name: formData.get('firstName'),
                last_name: formData.get('lastName'),
                email: formData.get('email'),
                password: formData.get('password'),
                organization_name: formData.get('firstName') + "'s Workspace"
            };
            var submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            try {
                var res = await fetch(API_URL + '/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                var data = await res.json();
                if (res.ok) {
                    successDiv.textContent = 'Account created! Redirecting...';
                    successDiv.classList.add('show');
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(function() { window.location.href = '/app/'; }, 1500);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.classList.add('show');
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });

        if (window.location.hash === '#register' || window.location.search.includes('trial')) {
            showRegister();
        }
    </script>
</body>
