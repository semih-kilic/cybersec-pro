<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Login - CyberSec Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 flex items-center justify-center">
    <div class="text-center">
        <!-- Loading Spinner -->
        <div id="loadingState">
            <div class="w-16 h-16 border-4 border-purple-500 border-t-transparent rounded-full spinner mx-auto mb-6"></div>
            <h2 class="text-2xl font-bold text-white mb-2">Connecting to GitHub</h2>
            <p class="text-gray-400">Please wait while we authenticate your account...</p>
        </div>
        
        <!-- Error State -->
        <div id="errorState" class="hidden">
            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Authentication Failed</h2>
            <p id="errorMessage" class="text-gray-400 mb-6">An error occurred during login.</p>
            <a href="/login" class="inline-flex items-center px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Login
            </a>
        </div>
        
        <!-- Success State -->
        <div id="successState" class="hidden">
            <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Login Successful!</h2>
            <p class="text-gray-400">Redirecting to dashboard...</p>
        </div>
    </div>
    
    <script>
        async function handleGitHubCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const successState = document.getElementById('successState');
            const errorMessage = document.getElementById('errorMessage');
            
            // Check for OAuth errors
            if (error) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorMessage.textContent = errorDescription || 'GitHub authentication was cancelled or failed.';
                return;
            }
            
            // Check for authorization code
            if (!code) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorMessage.textContent = 'No authorization code received from GitHub.';
                return;
            }
            
            try {
                // Exchange code for token via our backend
                const response = await fetch('/api/v1/auth/github', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success - store token and redirect
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    loadingState.classList.add('hidden');
                    successState.classList.remove('hidden');
                    
                    // Redirect to dashboard after short delay
                    setTimeout(() => {
                        window.location.href = '/app/';
                    }, 1500);
                } else {
                    // Backend returned an error
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    errorMessage.textContent = data.error || 'Failed to complete GitHub login.';
                }
            } catch (err) {
                console.error('GitHub callback error:', err);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorMessage.textContent = 'Connection error. Please try again.';
            }
        }
        
        // Run on page load
        handleGitHubCallback();
    </script>
</body>
</html>
