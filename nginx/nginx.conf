# ═══════════════════════════════════════════════════════════════════════════
# CyberSec Pro — Nginx (production edge, container)
# Edge: Cloudflare TLS -> :80. Static bind mounts + /api -> rust-backend:5001
# ═══════════════════════════════════════════════════════════════════════════
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/wasm font/woff font/woff2 image/svg+xml;

    upstream backend {
        server rust-backend:5001;
        keepalive 32;
    }

    # ── 1) ESKİ DOMAIN: semihkilic.com → cyber-sec-pro.com 301 ─────────────
    server {
        listen 80;
        listen [::]:80;
        server_name semihkilic.com www.semihkilic.com app.semihkilic.com
                    cybersecpro.semihkilic.com api.semihkilic.com;

        if ($host = api.semihkilic.com) {
            return 301 https://api.cyber-sec-pro.com$request_uri;
        }
        if ($host ~* ^(app|cybersecpro)\.semihkilic\.com$) {
            return 301 https://app.cyber-sec-pro.com$request_uri;
        }
        return 301 https://cyber-sec-pro.com$request_uri;
    }

    # ── 2) YENİ ANA DOMAIN: cyber-sec-pro.com (landing) ────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name cyber-sec-pro.com www.cyber-sec-pro.com;

        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($host = www.cyber-sec-pro.com) {
            return 301 https://cyber-sec-pro.com$request_uri;
        }

        root /srv/marketing;
        index index.html;

        location = / { try_files /en/index.html =404; }
        location = /robots.txt { try_files $uri =404; }
        location = /sitemap.xml { try_files $uri =404; }

        location ~ ^/(dashboard|login|register|auth|forgot-password|reset-password|verify-email)(/.*)?$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            return 301 https://app.cyber-sec-pro.com$request_uri;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

                location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

location / {
            try_files $uri $uri/ $uri.html /en$uri /en$uri.html =404;
        }

        access_log /var/log/nginx/cyber-sec-pro.access.log main;
        error_log  /var/log/nginx/cyber-sec-pro.error.log;
    }

    # ── 3) APP SUBDOMAIN: app.cyber-sec-pro.com (SaaS dashboard SPA) ───────
    server {
        listen 80;
        listen [::]:80;
        server_name app.cyber-sec-pro.com;

        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.stripe.com https://api.cyber-sec-pro.com wss: ws:; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"
            always;

        root /srv/dashboard;
        index index.html;

        location ^~ /dashboard/static-v2/ {
            alias /srv/dashboard/static-v2/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }
        location ^~ /dashboard/assets/ {
            alias /srv/dashboard/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location = /dashboard/sw.js {
            alias /srv/dashboard/sw.js;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Service-Worker-Allowed "/dashboard/" always;
            types { } default_type application/javascript;
        }
        location = /dashboard/manifest.json {
            alias /srv/dashboard/manifest.json;
            add_header Cache-Control "public, max-age=3600";
            default_type application/json;
        }
        location = /dashboard/icon-192.svg { alias /srv/dashboard/icon-192.svg; default_type image/svg+xml; }
        location = /dashboard/icon-192.png { alias /srv/dashboard/icon-192.png; default_type image/png; }
        location = /dashboard/icon-512.png { alias /srv/dashboard/icon-512.png; default_type image/png; }

        location /dashboard/ {
            alias /srv/dashboard/;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri $uri/ /index.html;
        }

        location = / {
            return 302 /dashboard/;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        access_log /var/log/nginx/app.cyber-sec-pro.access.log main;
        error_log  /var/log/nginx/app.cyber-sec-pro.error.log;
    }

    # ── 4) API SUBDOMAIN: api.cyber-sec-pro.com (Rust backend) ─────────────
    server {
        listen 80;
        listen [::]:80;
        server_name api.cyber-sec-pro.com;

        server_tokens off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin  "https://app.cyber-sec-pro.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        location / {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            client_max_body_size 50M;
        }

        access_log /var/log/nginx/api.cyber-sec-pro.access.log main;
        error_log  /var/log/nginx/api.cyber-sec-pro.error.log;
    }

    # ── 5) STATUS SUBDOMAIN: status.cyber-sec-pro.com (status page) ──────────
    server {
        listen 80;
        listen [::]:80;
        server_name status.cyber-sec-pro.com;

        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /srv/status;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        access_log /var/log/nginx/status.cyber-sec-pro.access.log main;
        error_log  /var/log/nginx/status.cyber-sec-pro.error.log;
    }
}
