[package]
name = "cybersec-service-manager"
version = "1.0.0"
edition = "2021"
description = "CyberSec Pro — Service Manager Daemon & Super Admin API"
authors = ["CyberSec Pro Team"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System monitoring
sysinfo = "0.31"

# Process management
nix = { version = "0.28", features = ["signal", "process"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

# Auth
jsonwebtoken = "9"

[profile.release]
opt-level = 3
lto = true
strip = true
