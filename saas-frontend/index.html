<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/dashboard/manifest.json" />
    <link rel="apple-touch-icon" href="/dashboard/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberSec Pro - Kali Dragon Cybersecurity Platform</title>
    <meta name="description" content="Professional cybersecurity testing platform with 682 verified security tools. Cyberpunk-themed interface inspired by Kali Linux dragon aesthetic." />
    
    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- DNS prefetch for API and external services -->
    <link rel="dns-prefetch" href="https://js.stripe.com">
    <link rel="dns-prefetch" href="https://api.stripe.com">
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#f8fafc" />
    
    <!-- Prevent flash of wrong theme before React hydrates -->
    <script>
      (function(){
        var s=localStorage.getItem('cybersecpro_color_mode');
        // Only go dark if user EXPLICITLY chose 'dark'. Ignore system preference.
        var m=(s==='dark')?'dark':'light';
        document.documentElement.classList.remove('dark','light');
        document.documentElement.classList.add(m);
      })();
    </script>
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="CyberSec Pro - Kali Dragon Cybersecurity Platform" />
    <meta property="og:description" content="Professional cybersecurity testing platform with cyberpunk-themed interface and 682 security tools." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberSec Pro - Kali Dragon Cybersecurity Platform" />
    <meta name="twitter:description" content="Professional cybersecurity testing platform with cyberpunk-themed interface and 682 security tools." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline support & caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/dashboard/sw.js', { scope: '/dashboard/' });
        });
      }
    </script>
  </body>
</html>
